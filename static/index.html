<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><script>try{var t=localStorage.getItem("rv.theme");if(t==="dark"||t==="system")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Readiverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#e2e2e2; --soft:#f4f4f4;
  --bad:#b3261e; --ok:#2f6b4f;
  --h1:#ffeb70; --h2:#bfe8c9; --h3:#c6dcff; --h4:#ffc9dd;
  --f-ui:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif; --f-zh:"Noto Sans TC","PingFang TC",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-read:"Source Serif 4",Georgia,"Noto Serif TC",serif;
  --lw:55%; --fs:18px;
}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--bg:#000;--surface:#0a0a0a;--ink:#fff;--muted:#9a9a9a;--line:#2a2a2a;--soft:#161616;--bad:#ff4d4f;--ok:#34d058;--h1:#6b5a00;--h2:#164a28;--h3:#1d3a66;--h4:#5e1f37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surface:#0a0a0a;--ink:#fff;--muted:#9a9a9a;--line:#2a2a2a;--soft:#161616;--bad:#ff4d4f;--ok:#34d058;--h1:#6b5a00;--h2:#164a28;--h3:#1d3a66;--h4:#5e1f37;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);height:100%}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6}
button,select,input,textarea{font:inherit;color:var(--ink)}
button,select,.filebtn,input[type=text],input[type=search],input[type=number]{font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;min-height:34px}
button,select,.filebtn{cursor:pointer}
button:hover,.filebtn:hover{border-color:var(--ink)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.small{min-height:28px;padding:2px 9px;font-size:12px}
.ghost{border-color:transparent;background:transparent}
.ghost:hover{background:var(--soft);border-color:transparent}
.on{background:var(--soft)!important;border-color:var(--ink)!important;font-weight:600}
.filebtn{display:inline-flex;align-items:center;gap:6px}
.filebtn input{display:none}
.note{color:var(--muted);font-size:13px}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
svg.i{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
textarea{width:100%;line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);resize:vertical;font-size:14px;font-family:var(--f-zh)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* ---------- 頂部導覽 ---------- */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:6px 18px;padding:0 clamp(16px,3.5vw,48px);height:56px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-read);font-weight:600;font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;padding:0;min-height:0;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.nav{display:flex;gap:2px}
.nav button{border:0;background:none;min-height:32px;padding:4px 10px;font-size:14px;color:var(--muted);border-radius:6px}
.nav button:hover{color:var(--ink);background:var(--soft)}
.nav button.on{color:var(--ink);font-weight:600;background:none!important;border:0!important}
@media (max-width:900px){.nav{display:none}}
.srch{position:relative;display:flex;align-items:center}
.seg.ic{border-radius:8px}.seg.ic .ib{width:34px;height:32px}
.filebtn.ib{width:34px;height:34px;min-height:0;justify-content:center}
.srch svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.srch input{padding-left:32px;width:200px;border-radius:999px;background:var(--soft);border-color:transparent;transition:width .2s}
.srch input:focus{width:260px;background:var(--bg);border-color:var(--line)}
@media (max-width:640px){.top{gap:8px}.srch input{width:96px}.srch input:focus{width:140px}.top .seg.ic,#themeBtn{display:none}.brand{font-size:18px}}
@media (max-width:400px){.brand{font-size:0;gap:0}.brand .dot{width:14px;height:14px}}
.avb{display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none;width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-family:var(--f-zh);font-size:15px}
.avb:hover{outline:2px solid var(--acc);outline-offset:2px}
.menu{position:absolute;right:0;top:44px;z-index:30;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:14px;display:flex;flex-direction:column;gap:12px}
.menu .who{display:flex;gap:10px;align-items:center}
.menu .who .avb{width:40px;height:40px;font-size:17px;pointer-events:none}
.menu .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:600;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 6px;min-height:32px;border-radius:6px;font-size:14px}
.menu .mi:hover{background:var(--soft)}

/* ---------- 首頁：大看板＋一排一排的書 ---------- */
:root{--acc:#c2410c;--gx:clamp(16px,3.5vw,48px)}
:root[data-theme="dark"]{--acc:#fb923c}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--acc:#fb923c}}
#vLib{padding-bottom:60px}
.hero{position:relative;overflow:hidden;min-height:min(300px,40vh);display:flex;align-items:flex-end;padding:30px var(--gx) 26px;isolation:isolate}
.hero .bg{position:absolute;inset:-40px;z-index:-2;background-size:cover;background-position:center;filter:blur(38px) saturate(1.3);opacity:.55;transform:scale(1.1)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--bg) 18%,color-mix(in srgb,var(--bg) 55%,transparent) 55%,transparent),linear-gradient(0deg,var(--bg),transparent 45%)}
.hero .in{display:flex;align-items:flex-end;gap:40px;width:100%}
.hero .tx{flex:1;min-width:0;max-width:640px;display:flex;flex-direction:column;gap:12px}
.hero .kick{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.hero h1{font-family:var(--f-read);font-weight:600;font-size:clamp(26px,3.4vw,42px);line-height:1.1;margin:0;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px}
.hero .pg{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);max-width:420px}
.hero .pg .bar{flex:1;height:4px}
.hero .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero .btns button,.hero .btns .filebtn{min-height:44px;padding:8px 22px;font-size:15px;font-weight:600;border-radius:8px;display:inline-flex;align-items:center;gap:8px}
.hero .btns .sec{background:color-mix(in srgb,var(--ink) 10%,transparent);border-color:transparent}
.hero .btns .sec:hover{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.hero .poster{flex:none;margin-left:auto;margin-right:clamp(0px,4vw,60px);width:clamp(120px,12vw,170px);aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.28);background:var(--soft);cursor:pointer;transform:rotate(2deg);transition:transform .25s}
.hero .poster:hover{transform:rotate(0) scale(1.02)}
.hero .poster img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:700px){.hero .poster{display:none}.hero{min-height:0;padding-top:40px}}
.shelf{margin-top:18px;position:relative}
.shelf .hd{display:flex;align-items:baseline;gap:10px;padding:0 var(--gx);margin-bottom:10px}
.shelf h2{font-family:var(--f-zh);font-size:19px;font-weight:700;margin:0}
.shelf .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.shelf .all{border:0;background:none;min-height:0;padding:2px 4px;font-size:13px;color:var(--muted);opacity:0;transition:opacity .15s}
.shelf:hover .all,.shelf .all:focus-visible{opacity:1;color:var(--acc)}
@media (hover:none){.shelf .all{opacity:1}}
.shelf.drop .track,.shelf.drop table{outline:2px dashed var(--acc);outline-offset:4px;border-radius:8px}
.stabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 var(--gx);margin:2px 0 0}
.stab{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;min-height:30px;font-size:13px}
.stab .n{font-family:var(--f-mono);font-size:11px;opacity:.6}
.stab.on{background:var(--ink)!important;color:var(--bg);border-color:var(--ink)!important;font-weight:600}
.stab.add{padding:4px 10px;color:var(--muted)}
.stab.drop{outline:2px dashed var(--acc);outline-offset:2px}
.page .all{opacity:1;color:var(--muted);border:0}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 var(--gx);padding:14px var(--gx) 18px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arr{position:absolute;top:50px;bottom:56px;width:var(--gx);min-width:36px;z-index:4;border:0;border-radius:0;background:color-mix(in srgb,var(--bg) 75%,transparent);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;padding:0;min-height:0}
.arr.l{left:0}.arr.r{right:0}
.shelf:has(.stabs) .arr{top:96px}
.shelf:hover .arr:not([disabled]){opacity:1}
.arr[disabled]{display:none}
.arr svg{width:26px;height:26px}
@media (hover:none){.arr{display:none}}
.dropzone{flex:none;width:min(320px,100%);height:64px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--muted);font-size:13px}
.pc{flex:none;width:168px;scroll-snap-align:start;position:relative;cursor:pointer;outline:none}
@media (max-width:640px){.pc{width:124px}}
.pc .po{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--soft);border:1px solid var(--line);transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s}
.pc .po img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.pc .fav,.pc .pb,.pc .ov{z-index:2}
.dcv{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:16px 14px 18px;text-align:left;color:#fff;background:linear-gradient(165deg,hsl(var(--hu) 48% 46%),hsl(calc(var(--hu) + 28) 52% 26%));overflow:hidden;container-type:inline-size}
.dcv::after{content:"";position:absolute;left:14px;right:14px;top:34px;height:1px;background:rgba(255,255,255,.35)}
.dcv .pk{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.75;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcv .pt{margin-top:14px;font-family:var(--f-read);font-weight:600;font-size:clamp(14px,13cqi,30px);line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.dcv .pa{margin-top:auto;font-size:clamp(10px,7.5cqi,15px);opacity:.88;font-family:var(--f-ui)}
.hero .poster{position:relative}
.hero .poster img{position:relative;z-index:1}
.pc .fav{position:absolute;top:6px;left:8px;font-size:14px;color:#f5b301;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.pc .pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.25)}
.pc .pb i{display:block;height:100%;background:var(--acc)}
.pc .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 10px;background:linear-gradient(0deg,rgba(0,0,0,.86),rgba(0,0,0,.35) 55%,transparent);color:#fff;opacity:0;transition:opacity .2s}
.pc .ov .t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc .ov .m{font-size:11px;opacity:.85;display:flex;flex-wrap:wrap;gap:4px 8px}
.pc .ov .b{display:flex;gap:6px}
.pc .ov .b button{width:32px;height:32px;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);color:#fff}
.pc .ov .b button.go{background:#fff;color:#111;border-color:#fff}
.pc .ov .b button:hover{border-color:#fff;background:rgba(255,255,255,.3)} .pc .ov .b button.go:hover{background:#e8e8e8}
.pc:hover .po,.pc:focus-visible .po{transform:scale(1.07);box-shadow:0 14px 30px rgba(0,0,0,.28);z-index:2}
.pc:hover .ov,.pc:focus-visible .ov{opacity:1}
.pc:focus-visible .po{outline:2px solid var(--acc);outline-offset:2px}
.pc .nm{margin-top:8px;font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
/* 查看全部／搜尋結果 */
.page{padding:28px var(--gx) 0}
.page .hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px}
.page h1{font-family:var(--f-zh);font-size:26px;margin:0}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 16px}
.wall .pc{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:32px;padding:4px 10px}
.seg button.on{border:0!important}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.pill{display:inline-block;font-size:11px;font-weight:600;line-height:1.3;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
table.list{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
table.list td{overflow:hidden;text-overflow:ellipsis}
.lt{display:flex;align-items:center;gap:12px}
.lt .th{flex:none;width:30px;height:42px;border-radius:3px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.lt .th img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:760px){table.list col.hm{width:0!important}}
table.list th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
table.list td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
table.list tr.r{cursor:pointer}
table.list tr.r:hover td{background:var(--soft)}
table.list td.mono{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:760px){table.list .hm{display:none}}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:48px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;margin:0 var(--gx)}
.empty b{font-family:var(--f-zh);font-size:17px}
#dropMask{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);display:flex;align-items:center;justify-content:center;border:3px dashed var(--ink);font-size:20px;font-weight:600;font-family:var(--f-zh)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast .spin{border-color:color-mix(in srgb,var(--bg) 40%,transparent);border-top-color:var(--bg)}
dialog{border:1px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{font-family:var(--f-zh);font-size:17px;margin:0 0 14px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld input,.fld select{width:100%}
.cvedit{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.cvedit .fld{gap:6px;align-items:flex-start}
.cvedit .filebtn{min-height:28px;padding:2px 9px;font-size:12px}
.danger{color:var(--bad)}
.danger:hover{border-color:var(--bad)}

/* ---------- 閱讀 ---------- */
#vRead{height:calc(100vh - 56px);display:flex;flex-direction:column}
#vRead .bar i{background:var(--ink)}
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line)}
.rbar .seg .ib{border-radius:0;height:32px;border:0}
#zhBtn.on,#allBtn.on{background:var(--ink)!important;color:var(--bg);border-color:var(--ink)!important}
.rbar .bt{font-family:var(--f-read);font-weight:600;font-size:16px;line-height:1.3;flex:1;min-width:0;overflow-wrap:anywhere}
.rbar>.grow{flex:0 0 0}
.pgnav{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:13px}
.pgnav input{width:64px;text-align:center;min-height:30px;padding:2px 4px;font-family:var(--f-mono)}
.ib{width:32px;height:32px;min-height:0;padding:0;display:inline-flex;align-items:center;justify-content:center}
#rs{flex:1;min-height:0;overflow:hidden;position:relative}
#rs.tall{overflow:auto}
#rs.pdfm{overflow:auto}
.sheet{position:relative;padding:0 clamp(12px,3vw,40px) 14px;min-height:100%;display:flex;flex-direction:column}
.sheet>.rf{margin-top:auto}
.r2.off{display:none!important}
.r2.cut{overflow:hidden}
@media (max-width:860px){.sheet .pnote:not(.has):not(:focus){display:none} .sheet .r2>.R:not(:has(.pnote.has,.hcard,.pnote:focus)){display:none} .sheet .r2>.L{padding-right:0}}
.r2.cut>.L,.r2.cut>.R{transform:translateY(var(--off,0))}
.sheet.tn{animation:tn .22s ease-out} .sheet.tp{animation:tp .22s ease-out}
@keyframes tn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes tp{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet.tn,.sheet.tp{animation:none}}
.r2{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);column-gap:0}
.r2>.L{padding:0 36px 0 0;min-width:0}
.r2>.R{padding:0 0 0 18px;min-width:0;display:flex;flex-direction:column;gap:6px}
.gut{position:absolute;top:0;bottom:0;left:calc(clamp(12px,3vw,40px) + (100% - 2 * clamp(12px,3vw,40px)) * var(--lwn));width:9px;margin-left:-4px;cursor:col-resize;z-index:3}
.gut::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--line)}
.gut:hover::after,.gut.drag::after{width:2px;background:var(--ink)}
.rhead{padding:22px 0 10px}
.rhead .L{display:flex;align-items:flex-end}
.pgsep{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.rhead textarea{min-height:34px;font-size:13px;padding:5px 10px;border-color:transparent;background:var(--soft);resize:none}
.rhead textarea:focus{border-color:var(--line);background:var(--bg)}
.para{display:block;border-radius:6px;transition:background .15s;max-width:860px;margin-left:auto;margin-right:auto}
.r2{padding:6px 0}
.para .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:.45em;text-align:right;user-select:none}
.ptx{font-family:var(--f-read);font-size:var(--fs);line-height:1.75;hyphens:auto}

.para.flash{animation:fl 1s}
@keyframes fl{0%,40%{background:color-mix(in srgb,var(--ink) 14%,transparent)}100%{background:transparent}}
.zh{font-family:var(--f-zh);font-size:calc(var(--fs) - 3px);line-height:1.8;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:6px 0 4px;outline:none;border-radius:0 4px 4px 0}
.zh:focus{background:var(--soft);color:var(--ink)}
.zh.wait{font-style:italic}
mark.hl{color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
mark.c1{background:var(--h1)} mark.c2{background:var(--h2)} mark.c3{background:var(--h3)} mark.c4{background:var(--h4)}
mark.hl.lit{box-shadow:0 0 0 2px var(--ink)}
.pnote{width:100%;min-height:32px;font-size:13.5px;padding:5px 9px;border:1px solid transparent;background:transparent;resize:none;overflow:hidden;border-radius:7px;color:var(--ink);transition:border-color .12s}
.pnote::placeholder{color:transparent}
.r2.hov .pnote::placeholder,.pnote:focus::placeholder{color:var(--muted)}
.pnote.has{border-left:2px solid var(--line);border-radius:0}
.pnote:focus{border-color:var(--line);border-radius:7px;background:transparent}
@media (hover:none){.pnote::placeholder{color:var(--muted)}}
.addn{align-self:flex-start;opacity:0;transition:opacity .12s;border:1px dashed var(--line);background:none;color:var(--muted);font-size:12px;min-height:26px;padding:2px 9px}
.r2.hov .addn,.addn:focus-visible{opacity:1}
@media (hover:none){.addn{opacity:.7}}
.fig{margin:10px auto 14px;max-width:860px;font-size:16px;display:flex;flex-direction:column;gap:6px}
.fig img{max-width:100%;height:auto;object-fit:contain;align-self:center;border-radius:6px;cursor:zoom-in;background:#fff;border:1px solid var(--line)}
.fig figcaption{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center;text-align:center}
.tblw{overflow-x:auto}
.tblsw{min-height:24px;padding:1px 9px;font-size:11.5px;margin-left:8px}
.tbl{border-collapse:collapse;margin:0 auto;font-family:var(--f-read);font-size:15px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);font-weight:600}
.aipg{width:28px;height:28px;margin-left:8px;color:var(--muted)}
.aipg:hover:not(:disabled){color:var(--acc)}
.aipgbtn{position:relative}
.aipgbtn.warn::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#e0a100}
.aipgbtn.busy svg{animation:sp 1.2s linear infinite}
.ocrwarn{margin-left:6px;min-height:24px;padding:1px 9px;font-size:11.5px;border-radius:999px;border:1px solid #e0a100;color:#9a6b00;background:#fff8e1}
:root[data-theme="dark"] .ocrwarn{background:#2a2200;color:#ffcc4d;border-color:#7a5e00}
.rhead .L{align-items:center!important;display:block!important}
.sheet{transition:opacity .12s ease}
.sheet.fsfade{opacity:0}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.pgsub{font-family:var(--f-mono);font-size:11px;color:var(--acc);margin-left:6px}
.notext{border:1.5px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
#pdfView{display:flex;justify-content:center;padding:22px 12px 40px}
#pdfView canvas{max-width:100%;height:auto;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.rfoot{display:flex;align-items:center;gap:14px;max-width:860px;margin:10px auto 0;padding:12px 0 0;border-top:1px solid var(--line)}
.ptop{display:flex;align-items:center;gap:6px;max-width:860px;margin:0 auto;width:100%}
.pgbtn{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:4px 10px 4px 8px;font-size:13px;border-radius:999px}
.pgbtn[data-turn="1"]{padding:4px 8px 4px 12px}
.pgbtn svg{width:15px;height:15px}
.ptop .pgbtn{min-height:28px;font-size:12px;border-color:transparent;background:var(--soft)}
.ptop .pgbtn:hover:not(:disabled){border-color:var(--ink)}
@media (max-width:640px){.pgbtn span{display:none}.pgbtn{padding:4px 8px!important}}
.rfoot .bar{flex:1}
.rfoot .pc{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.hcard{border:1px solid var(--line);border-left:4px solid var(--hc,var(--line));border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.hcard .q{font-family:var(--f-read);font-size:13px;line-height:1.45;cursor:pointer;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hcard .q:hover{color:var(--ink)}
.hcard .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.hcard textarea{min-height:44px;font-size:14px;padding:6px 8px;border-color:transparent;background:var(--soft);resize:none;overflow:hidden}
.hcard textarea:focus{border-color:var(--line);background:var(--bg)}
.hcard .x{margin-left:auto;border:0;background:none;color:var(--muted);min-height:0;padding:2px 4px}
.hcard .x:hover{color:var(--bad)}
.hc0{--hc:var(--ink)} .hc1{--hc:var(--h1)} .hc2{--hc:var(--h2)} .hc3{--hc:var(--h3)} .hc4{--hc:var(--h4)}
.hcard.focus,.hcard.lit{border-color:var(--ink)}
@media (max-width:860px){.r2{grid-template-columns:minmax(0,1fr)} .r2>.L{padding:0} .r2>.R{padding:6px 0 0} .r2>.R:empty{display:none} .gut{display:none} .addn{opacity:.7}}
#allPane{position:fixed;top:56px;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);border-left:1px solid var(--ink);z-index:20;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
#allPane .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
#allPane .bd{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.pghd{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px;cursor:pointer}
.pghd:hover{color:var(--ink)}
.hlpop{position:fixed;z-index:30;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--ink);border-radius:9px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hlpop .sw{width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:1px solid var(--line)}
.hlpop .sw:hover{border-color:var(--ink);transform:scale(1.1)}
.hlpop .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.hlpop .ib{width:30px;height:30px}
.sw1{background:var(--h1)!important}.sw2{background:var(--h2)!important}.sw3{background:var(--h3)!important}.sw4{background:var(--h4)!important}
.toc{position:absolute;z-index:25;background:var(--surface);border:1px solid var(--ink);border-radius:10px;padding:6px;max-height:60vh;overflow:auto;width:min(360px,calc(100vw - 32px));box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;min-height:0;font-size:13px;border-radius:5px}
.toc button:hover{background:var(--soft)}
.toc .pn{float:right;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:10px}
.err{color:var(--bad);font-size:13px}
.aist{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.aist.bad{color:var(--bad)}
.stor{display:flex;flex-direction:column;gap:6px}
.stor label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer}
.stor label:has(input:checked){border-color:var(--ink)}
.stor small{display:block;color:var(--muted);font-size:12px;word-break:break-all}
/* ---------- 字典、收藏：文章裡的底線（單字＝青綠＋◆、句子＝紫＋✦），跟雅思練習室一樣 ---------- */
:root{--vw:#0e8f7e;--ph:#6b5bd6}
:root[data-theme="dark"]{--vw:#4fd1bd;--ph:#a99cff}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--vw:#4fd1bd;--ph:#a99cff}}
.vw{text-decoration:underline;text-decoration-color:var(--vw);text-decoration-thickness:2.5px;text-underline-offset:5px;text-decoration-skip-ink:none;cursor:pointer}
.vw{white-space:nowrap}
.vw.last::after{content:"◆";display:inline-block;text-indent:0;text-decoration:none;font-size:.45em;color:var(--vw);vertical-align:super;margin-left:2px;font-family:sans-serif}
.vw:hover{background:color-mix(in srgb,var(--vw) 12%,transparent);border-radius:3px}
.ph{text-decoration:underline;text-decoration-skip-ink:none;text-decoration-color:var(--ph);text-decoration-thickness:2.5px;text-underline-offset:4px;cursor:pointer}
.ph.last::after{content:"✦";display:inline-block;text-indent:0;text-decoration:none;font-size:.62em;color:var(--ph);vertical-align:super;margin-left:1px;font-family:sans-serif}
.ph:hover{background:color-mix(in srgb,var(--ph) 12%,transparent);border-radius:3px}
/* 小卡片（點底線） */
.wcard{position:fixed;z-index:40;width:min(380px,calc(100vw - 24px));max-height:min(70vh,560px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.18);padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.wcard .hd{display:flex;align-items:center;gap:8px;min-width:0}
.wcard .hw{min-width:0;overflow-wrap:anywhere}
.wcard .tag{white-space:nowrap;flex:none}
.wcard .phon{margin-top:-4px;line-height:1.5;white-space:nowrap}
.wcard .hw{font-family:var(--f-read);font-size:22px;font-weight:600;line-height:1.2}
.wcard .phon{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.wcard .zhm{font-family:var(--f-zh);font-size:15px;line-height:1.7}
.wcard .lab{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:2px}
.wcard .exs{display:flex;flex-direction:column;gap:6px}
.wcard .exs div{font-family:var(--f-read);line-height:1.5}
.wcard .exs small{display:block;font-family:var(--f-zh);color:var(--muted);font-size:13px}
.wcard .defs{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-family:var(--f-read);font-size:13.5px}
.wcard .defs em{color:var(--muted);font-style:normal;font-family:var(--f-mono);font-size:11px;margin-right:4px}
.wcard .ctx{font-family:var(--f-read);color:var(--muted);line-height:1.5}
.wcard .ctx b,.wcard .exs b{color:var(--ink)}
.wcard .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.wcard .aibox{background:var(--soft);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.wcard .key{font-family:var(--f-read);font-size:19px;font-weight:600;color:var(--ph)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.vwc{color:var(--vw);border-color:var(--vw)} .tag.phc{color:var(--ph);border-color:var(--ph)}
.saybtn{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
/* 首頁上方的入口 icon */
.colbtn{position:relative;width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.colbtn.vwb{color:var(--vw)} .colbtn.phb{color:var(--ph)}
.colbtn:hover{border-color:currentColor}
.colbtn.on{background:color-mix(in srgb,currentColor 12%,var(--surface))!important;border-color:currentColor!important}
.colbtn .cn{position:absolute;top:-5px;right:-7px;font-family:var(--f-mono);font-size:9.5px;font-weight:600;background:currentColor;border-radius:999px;padding:0 4px;line-height:15px;min-width:15px;text-align:center}
.colbtn .cn i{font-style:normal;color:var(--bg)}
/* 字典頁、句子收藏頁 */
.dictbox{display:flex;gap:8px;align-items:center;max-width:620px;margin-bottom:16px}
.dictbox input{flex:1;font-size:16px;min-height:42px;border-radius:10px}
.dres{border:1px solid var(--line);border-radius:12px;padding:16px;max-width:620px;margin-bottom:22px;display:flex;flex-direction:column;gap:10px}
table.vt{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
table.vt th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 8px}
table.vt td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top}
table.vt tr:hover td{background:var(--soft)}
table.vt .w{font-family:var(--f-read);font-weight:600;font-size:16px;cursor:pointer}
table.vt .m{font-family:var(--f-zh);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.vt .c{font-family:var(--f-read);color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
table.vt .c b{color:var(--ink)}
table.vt .src{font-size:12px;color:var(--muted)}
table.vt .fg{font-family:var(--f-mono);font-size:12px;text-align:center}
@media (max-width:760px){table.vt .hm{display:none}}
.pwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pcard{border:1px solid var(--line);border-left:4px solid var(--ph);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;background:var(--surface)}
.pcard .key{font-family:var(--f-read);font-size:18px;font-weight:600}
.pcard .pzh{font-family:var(--f-zh)}
.pcard .pat{font-size:13px;color:var(--ph);font-family:var(--f-mono)}
.pcard .note,.pcard .from{font-size:13px;color:var(--muted)}
.pcard .ex{font-family:var(--f-read);font-size:14px;line-height:1.5}
.pcard .ex small{display:block;font-family:var(--f-zh);color:var(--muted)}
.pcard .orig{font-family:var(--f-read);font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.pcard .acts{display:flex;gap:4px;justify-content:flex-end;margin-top:auto}
.pcard.err{border-left-color:var(--bad)} .pcard.run{border-left-color:var(--line)}
.morebtn{display:block;margin:20px auto 0}
/* ---------- 像在讀書：紙、首行縮排、左右對齊、章名、首字放大、書眉、頁碼 ---------- */
:root{--paper:#ffffff;--pink:#111111;--pmuted:#6b6b6b;--pline:#e2e2e2}
:root[data-theme="dark"]{--paper:#000000;--pink:#f2f2f2;--pmuted:#9a9a9a;--pline:#2a2a2a}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--paper:#000000;--pink:#f2f2f2;--pmuted:#9a9a9a;--pline:#2a2a2a}}
#rs{background:var(--paper)}
#vRead .rbar{background:var(--paper);border-bottom-color:var(--pline)}
.sheet .gut::after{background:var(--pline)}
.sheet .r2{padding:0}
.sheet .r2>.L{padding-right:44px}
.para{max-width:min(680px,100%)}
.ptx *{text-indent:0}
.ptx{color:var(--pink);text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto;line-height:1.72;text-indent:1.6em;margin:0;font-variant-ligatures:common-ligatures;font-kerning:normal}
.ptx.noind{text-indent:0}
.r2.rc+.r2.rc .para{margin-top:0}
.para.hd{text-align:center;margin:1.4em auto .9em}
.para.hd .ptx{text-indent:0;text-align:center;font-weight:600;font-size:calc(var(--fs) * 1.35);line-height:1.3;letter-spacing:.01em}
.para.hd.sub{text-align:left;margin:1.1em auto .5em}
.para.hd.sub .ptx{text-align:left;font-size:calc(var(--fs) * 1.08)}
.para.cap .ptx::first-letter{float:left;font-size:3.3em;line-height:.82;padding:.06em .08em 0 0;font-weight:600;color:var(--pink)}
.zh{color:var(--pmuted);border-left-color:var(--pline);text-indent:0}
.runhead{flex:1;min-width:0;text-align:center;font-family:var(--f-read);font-variant:small-caps;letter-spacing:.12em;font-size:12.5px;color:var(--pmuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folio{font-family:var(--f-read);font-size:13px;color:var(--pmuted);letter-spacing:.08em;white-space:nowrap}
.folio .pgsub{margin-left:6px}
.rfoot{border-top:0!important;justify-content:space-between}
.rfoot .pgbtn,.ptop .pgbtn{background:transparent!important;border-color:transparent;color:var(--pmuted)}
.rfoot .pgbtn:hover:not(:disabled),.ptop .pgbtn:hover:not(:disabled){color:var(--pink);border-color:var(--pline)}
.rhead{padding:16px 0 18px}
.sheet .R .pnote{color:var(--pink)}
.sheet .R .pnote.has{border-left-color:var(--pline)}
.rhead textarea{background:transparent!important;border-color:transparent!important;color:var(--pink)}
.rhead textarea:focus{border-color:var(--pline)!important}
.rhead textarea::placeholder{color:transparent}
.rhead:hover textarea::placeholder,.rhead textarea:focus::placeholder{color:var(--pmuted)}

/* ---------- 設定（像 Mac 的系統設定：分區、每一項一列） ---------- */
dialog.setdlg{width:min(680px,calc(100vw - 32px));max-height:min(86vh,860px);padding:0;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.18);overflow:hidden}
dialog.setdlg form{display:flex;flex-direction:column;max-height:min(86vh,860px)}
.shead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.shead h2{margin:0;font-size:18px}
.sbody{overflow:auto;padding:6px 20px 18px;display:flex;flex-direction:column;gap:6px}
.ssec{padding:14px 0 6px;border-bottom:1px solid var(--line)}
.ssec:last-child{border-bottom:0}
.ssec h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.srow{display:flex;align-items:center;gap:16px;padding:9px 0}
.srow+.srow{border-top:1px solid var(--soft)}
.sl{flex:1;min-width:0}
.st{font-size:14.5px;font-weight:500}
.sd{font-size:12.5px;color:var(--muted);line-height:1.5}
.sc{flex:none;display:flex;align-items:center;gap:8px}
.sc select,.sc input[type=text]{min-width:170px;width:200px}
.catrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.catrow input{flex:1;min-width:0;width:auto}
.stor{display:flex;flex-direction:column;gap:6px}
.sopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px}
.sopt:has(input:checked){border-color:var(--ink);background:var(--soft)}
.sopt input{width:auto!important;margin-top:3px;flex:none}
.sot{min-width:0}
.sot small{display:block;color:var(--muted);font-size:11.5px;word-break:break-all;margin-top:2px}
.sfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface)}
.aitest{font-size:12.5px;margin-top:4px}
.logbox{margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.logbox a{color:var(--acc)}
.aitest.ok{color:var(--ok)} .aitest.bad{color:var(--bad)}
.sw-toggle{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.sw-toggle input{opacity:0;width:0;height:0;position:absolute}
.sw-toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw-toggle span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw-toggle input:checked+span{background:var(--ink)}
.sw-toggle input:checked+span::after{transform:translateX(18px)}
.sw-toggle input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:560px){.srow{flex-direction:column;align-items:stretch;gap:6px}.sc select,.sc input[type=text]{width:100%}}
</style></head>
<body>

  <span class="grow"></span>
  <span id="libTools" class="row" style="gap:10px;flex-wrap:nowrap">
    <button type="button" class="colbtn vwb" data-f="vocab" title="我的字典（收藏的單字）" aria-label="我的字典"><svg class="i" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 20.5zM9 7h7M9 10.5h5"/></svg><span class="cn" id="vwN"></span></button>
    <button type="button" class="colbtn phb" data-f="phr" title="句子收藏（收藏的片語、句型）" aria-label="句子收藏"><svg class="i" viewBox="0 0 24 24"><path d="M7 7h4v4c0 3-1.5 5-4 6M14 7h4v4c0 3-1.5 5-4 6"/></svg><span class="cn" id="phN"></span></button>
    <label class="srch"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="q" placeholder="搜尋書、單字、句子" aria-label="搜尋"></label>
    <div class="seg ic" role="group" aria-label="顯示方式"><button type="button" data-view="grid" class="ib" title="卡片模式" aria-label="卡片模式"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></button><button type="button" data-view="list" class="ib" title="清單模式" aria-label="清單模式"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></button></div>
    <label class="filebtn primary ib imp" title="匯入 PDF（也可以直接拖進視窗）" aria-label="匯入 PDF" style="border-radius:50%;padding:0"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg><input type="file" id="fileIn" accept="application/pdf,.pdf" multiple></label>
  </span>
  <button type="button" class="ib ghost" id="themeBtn" title="切換淺色／深色" aria-label="切換淺色／深色"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <span style="position:relative"><button type="button" class="avb" id="avBtn" aria-haspopup="true" aria-expanded="false" title="帳號與設定">R</button><div class="menu" id="menu" hidden></div></span>
</div>

<!-- ===== 書庫 ===== -->
<section id="vLib"></section>

<!-- ===== 閱讀 ===== -->
<section id="vRead" hidden>
  <div class="rbar">
    <button type="button" class="ib" id="back" title="回到書庫（Esc）" aria-label="回到書庫"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="bt" id="rTitle"></span>
    <span style="position:relative"><button type="button" class="ib" id="tocBtn" hidden title="目錄" aria-label="目錄"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button><div class="toc" id="toc" hidden></div></span>
    <span id="rAi"></span>
    <span class="grow"></span>
    <button type="button" class="ib" id="zhBtn" title="中文對照：在每段英文底下顯示 AI 翻譯" aria-label="中文對照" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h8M8 3v2M5.5 5c.5 3 2.5 5.5 5.5 6.5M10.5 5c-.6 3.2-2.8 5.7-6 7"/><path d="M13 21l4-9 4 9M14.4 18h5.2"/></svg></button>
    <button type="button" class="ib aipgbtn" id="aiPgBtn" title="用 AI 整理這一頁（重新分段、修正 OCR 錯字）" aria-label="用 AI 整理這一頁"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8zM5 15l.6 1.4L7 17l-1.4.6L5 19l-.6-1.4L3 17l1.4-.6z"/></svg></button>
    <div class="seg" role="group" aria-label="左邊顯示">
      <button type="button" class="ib" data-mode="text" title="文字模式：可以畫螢光筆、寫筆記" aria-label="文字模式"><svg class="i" viewBox="0 0 24 24"><path d="M5 6h14M5 10h14M5 14h14M5 18h9"/></svg></button><button type="button" class="ib" data-mode="pdf" title="原始 PDF 頁面" aria-label="原始 PDF 頁面"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><rect x="8" y="11" width="8" height="6" rx="1"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="字體大小"><button type="button" id="fsDn" title="字小一點">A−</button><button type="button" id="fsUp" title="字大一點">A＋</button></div>
    <button type="button" class="ib" id="allBtn" title="全書筆記：整本書的螢光筆和筆記" aria-label="全書筆記"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg></button>
    <div class="pgnav">
      <button type="button" class="ib" id="prev" title="上一頁（←）" aria-label="上一頁"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <input type="number" id="pgIn" min="1" aria-label="頁碼"><span>/ <span id="pgN">0</span></span>
      <button type="button" class="ib" id="next" title="下一頁（→）" aria-label="下一頁"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </div>
  <div id="rs">
    <div class="sheet" id="sheet"></div>
    <div id="pdfView" hidden></div>
  </div>
  <aside id="allPane" hidden aria-label="全書筆記">
    <div class="hd"><b style="font-family:var(--f-zh)">全書筆記</b><span class="grow"></span><span id="allTools" class="row"></span><button type="button" class="ib ghost" id="allX" title="關閉" aria-label="關閉">×</button></div>
    <div class="bd" id="allBody"></div>
  </aside>
</section>

<div id="dropMask" hidden>放開就匯入 PDF</div>
<div class="toast" id="toast" hidden></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){ try{ const v=localStorage.getItem('rv.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('rv.'+k,JSON.stringify(v)); }catch(e){} }};
const api={
  async req(m,u,body,raw){ const o={method:m,headers:{}}; if(body!==undefined){ if(raw){ o.body=body; } else { o.body=JSON.stringify(body); o.headers['Content-Type']='application/json'; } }
    const r=await fetch(u,o); let j=null; try{ j=await r.json(); }catch(e){} if(!r.ok) throw new Error((j&&j.error)||('HTTP '+r.status)); return j; },
  get:u=>api.req('GET',u), put:(u,b,raw)=>api.req('PUT',u,b,raw), post:(u,b,raw)=>api.req('POST',u,b,raw), patch:(u,b)=>api.req('PATCH',u,b), del:u=>api.req('DELETE',u)};
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const STATUS={unread:'未讀',reading:'閱讀中',done:'已完成'};
let toastT=null;
function toast(html,ms){ const t=$('toast'); t.innerHTML=html; t.hidden=false; clearTimeout(toastT); if(ms!==0) toastT=setTimeout(()=>t.hidden=true,ms||2600); }

/* ---------- 主題 ---------- */
function isDark(){ const t=document.documentElement.getAttribute('data-theme'); return t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches); }
function setTheme(t){ if(t==='dark'||t==='system') document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); try{ localStorage.setItem('rv.theme',t||'light'); }catch(e){} }
$('themeBtn').onclick=()=>setTheme(isDark()?'light':'dark');

/* =====================================================================
   書庫
   ===================================================================== */
let LIB={books:[],categories:[]}, FILTER=(f=>f==='all'?'home':f)(LS.get('filter2','home')), VIEW=LS.get('view2','grid'), SORT=LS.get('sort','opened');
async function loadLib(){ await loadCaps(); LIB=await api.get('/api/library'); renderLib(); }
const stTag=b=>`<span data-st="${b.id}">${aiTag(b)}</span>`;   // 背景處理的進度：只更新這一小塊，首頁不用整個重畫
function aiTag(b){ const a=b.ai||{}, r=b.parse||{}, sp='<span class="spin"></span>';
  if(r.status==='running') return `<span class="aist" title="Docling 在背景解析版面：分段、圖片、表格">${sp}版面解析中${r.total?` ${Math.min(r.next||0,r.total)}/${r.total} 頁`:''}</span>`;
  if(r.status==='queued') return `<span class="aist">${sp}${CAPS.docling&&CAPS.docling.status==='installing'?'等 Docling 安裝好':'等待版面解析'}</span>`;
  if(a.status==='running'||a.status==='queued') return `<span class="aist">${sp}AI 判斷書名、分類中</span>`;
  const pf=b.proof||{}; if(pf.status==='running'||pf.status==='queued') return `<span class="aist" title="Claude 逐頁對照原書，修正漏字和錯字">${sp}AI 校對中 ${pf.done||0}/${pf.total||0} 頁</span>`;
  if(pf.status==='error') return `<span class="aist bad" title="${esc(pf.error||'')}">AI 校對中斷</span>`;
  const fx=b.fix||{}; if(fx.status==='running') return `<span class="aist" title="掃描書：AI 正在修正辨識錯字比較多的頁">${sp}AI 修正錯字中 ${fx.done||0}/${fx.total||0} 頁</span>`;
  if(r.status==='error') return `<span class="aist bad" title="${esc(r.error||'')}">版面解析失敗</span>`;
  if(a.status==='error') return `<span class="aist bad" title="${esc(a.error||'')}">AI 判斷失敗</span>`; return ''; }
const busy=b=>['running','queued'].includes((b.ai||{}).status)||['running','queued'].includes((b.parse||{}).status)||(b.fix||{}).status==='running'||['running','queued'].includes((b.proof||{}).status);
let CAPS={}; async function loadCaps(){ try{ CAPS=await api.get('/api/caps'); }catch(e){} }
let libPollT=null;
// 首頁會變的東西（書名、作者、封面、分類…）；進度數字不算
const libSig=L=>JSON.stringify([L.categories,(L.profile||{}).name,L.books.map(b=>[b.id,b.title,b.author,b.category,b.tags,b.cover,b.coverV,b.favorite,b.status,b.lastPage,b.notes,b.marks,(b.parse||{}).status,(b.proof||{}).status,(b.ai||{}).status])]);
function pollLib(){ clearTimeout(libPollT); if(LIB.books.some(busy)) libPollT=setTimeout(async()=>{ if(!$('vLib').hidden){ try{ await loadCaps(); const before=libSig(LIB); LIB=await api.get('/api/library');
      if(libSig(LIB)!==before) renderLib(true);                           // 真的有東西變了才重畫
      else { LIB.books.forEach(b=>document.querySelectorAll(`[data-st="${b.id}"]`).forEach(el=>{ const h=aiTag(b); if(el.innerHTML!==h) el.innerHTML=h; })); pollLib(); }
    }catch(e){ pollLib(); } } else pollLib(); },4000); }
function prog(b){ return b.pages?Math.min(1,(b.lastPage+1)/b.pages):0; }
const byOpened=(a,b)=>(b.opened||b.added)-(a.opened||a.added);
const SORTS={opened:byOpened,added:(a,b)=>b.added-a.added,title:(a,b)=>a.title.localeCompare(b.title,'zh-Hant'),progress:(a,b)=>prog(b)-prog(a)};
function inFilter(b,f){ return f==='fav'?b.favorite:f==='reading'?b.status==='reading':f==='done'?b.status==='done':f==='none'?!b.category:f.startsWith('c:')?b.category===f.slice(2):true; }
function filterName(f){ return f==='all'?'全部書籍':f==='fav'?'我的最愛':f==='reading'?'閱讀中':f==='done'?'已完成':f==='none'?'未分類':f.slice(2); }
const coverUrl=b=>`/books/${b.id}/cover.jpg?v=${b.coverV||b.added}`;
const hasCover=b=>b.cover!==false;
function hueOf(t){ let h=0; for(const c of String(t)) h=(h*31+c.codePointAt(0))>>>0; return h%360; }
// 設計好的封面：沒有真正封面的書（第一頁是滿滿文字）用書名＋作者
function designCover(b){ return `<div class="dcv" style="--hu:${hueOf(b.title)}"><span class="pk">${esc(b.category||'Readiverse')}</span><span class="pt">${esc(b.title)}</span>${b.author?`<span class="pa">${esc(b.author)}</span>`:''}</div>`; }
const coverImg=(b,lazy)=>hasCover(b)?`<img src="${coverUrl(b)}" alt="" ${lazy?'loading="lazy" ':''}onerror="this.remove()">`:'';
const IC={play:'<svg class="i" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4.5v15l13-7.5z"/></svg>',
  more:'<svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  star:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  l:'<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>', r:'<svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>'};
function posterCard(b){
  const p=Math.round(prog(b)*100), started=b.opened||b.lastPage;
  return `<div class="pc" role="button" tabindex="0" data-open="${b.id}" draggable="true" data-drag="${b.id}" aria-label="打開 ${esc(b.title)}">
    <div class="po">${designCover(b)}${coverImg(b,1)}${b.favorite?'<span class="fav" aria-label="最愛">★</span>':''}
      ${started&&b.status!=='done'?`<div class="pb"><i style="width:${p}%"></i></div>`:''}
      <div class="ov"><div class="t">${esc(b.title)}</div><div class="m">${b.pages?`<span>${started?`${b.lastPage+1}/${b.pages} 頁`:`${b.pages} 頁`}</span>`:''}${b.notes?`<span>✎ ${b.notes}</span>`:''}${b.category?`<span>${esc(b.category)}</span>`:''}</div>
        <div class="b"><button type="button" class="go" data-open="${b.id}" title="${started?'繼續閱讀':'開始閱讀'}" aria-label="${started?'繼續閱讀':'開始閱讀'}">${IC.play}</button><button type="button" data-fav="${b.id}" title="${b.favorite?'取消最愛':'加到最愛'}" aria-label="${b.favorite?'取消最愛':'加到最愛'}" style="${b.favorite?'color:#f5b301':''}">${IC.star}</button><button type="button" data-edit="${b.id}" title="詳細資料" aria-label="詳細資料">${IC.more}</button></div></div>
    </div>
    <div class="nm">${esc(b.title)}</div><div class="sub">${b.author?`<span>${esc(b.author)}</span>`:''}${stTag(b)}</div></div>`; }
function shelf(title,f,L,drop){
  if(!L.length&&!drop) return '';
  return `<section class="shelf"${drop?` data-drop="${esc(f)}"`:''}><div class="hd"><h2>${esc(title)}</h2><span class="cnt">${L.length}</span>${L.length?`<button type="button" class="all" data-f="${esc(f)}">查看全部 ›</button>`:''}</div>
    <button type="button" class="arr l" data-scroll="-1" aria-label="往左" disabled>${IC.l}</button>
    <div class="track">${L.length?L.slice(0,30).map(posterCard).join(''):'<div class="dropzone">還沒有書：把書拖到這一排，就會放進這個分類</div>'}</div>
    <button type="button" class="arr r" data-scroll="1" aria-label="往右">${IC.r}</button></section>`; }
function heroHtml(){
  const B=LIB.books;
  if(!B.length) return `<div class="hero"><div class="in"><div class="tx"><span class="kick">你的英文書房</span><h1>把書放進來，開始讀吧</h1>
    <div class="meta">匯入 PDF（或直接拖進這個視窗），AI 會幫你整理書名、分類和段落。左邊讀英文、右邊寫筆記，螢光筆、中文對照都有。</div>
    <div class="btns"><label class="filebtn primary">選擇 PDF<input type="file" accept="application/pdf,.pdf" multiple data-file></label><button type="button" class="sec" data-settings>設定</button></div></div></div></div>`;
  const b=B.filter(x=>x.opened&&x.status!=='done').sort(byOpened)[0]||B.slice().sort((x,y)=>y.added-x.added)[0], started=b.opened||b.lastPage;
  return `<div class="hero"><div class="bg" style="${hasCover(b)?`background-image:url('${coverUrl(b)}')`:`background:hsl(${hueOf(b.title)} 55% 55%)`}"></div><div class="in">
    <div class="tx"><span class="kick">${started?'繼續閱讀':'最新加入'}</span><h1>${esc(b.title)}</h1>
      <div class="meta">${b.author?`<span>${esc(b.author)}</span>`:''}${b.category?`<span>${esc(b.category)}</span>`:''}${b.pages?`<span>${b.pages} 頁</span>`:''}${(b.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join('')}${b.notes?`<span>✎ ${b.notes} 則筆記</span>`:''}${stTag(b)}</div>
      ${started&&b.pages?`<div class="pg"><div class="bar"><i style="width:${Math.round(prog(b)*100)}%"></i></div><span>第 ${b.lastPage+1} / ${b.pages} 頁</span></div>`:''}
      <div class="btns"><button type="button" class="primary" data-open="${b.id}">${IC.play}${started?'繼續閱讀':'開始閱讀'}</button><button type="button" class="sec" data-edit="${b.id}">${IC.more}詳細資料</button></div></div>
    <div class="poster" data-open="${b.id}" role="button" tabindex="-1" aria-hidden="true">${designCover(b)}${coverImg(b)}</div></div></div>`; }
function renderLib(soft){
  pollLib(); renderMenu(); document.querySelectorAll('.top [data-view]').forEach(b=>{ b.classList.toggle('on',b.dataset.view===VIEW); b.setAttribute('aria-pressed',String(b.dataset.view===VIEW)); });
  const q=$('q').value.trim().toLowerCase(), el=$('vLib');
  document.querySelectorAll('#nav [data-f],.top .colbtn').forEach(b=>b.classList.toggle('on',(!q||b.classList.contains('colbtn'))&&b.dataset.f===FILTER));
  const keep=soft?[...el.querySelectorAll('.track')].map(t=>t.scrollLeft):null, top=scrollY;
  if(FILTER==='vocab'){ el.innerHTML=vocabPage(q); colCounts(); }
  else if(FILTER==='phr'){ el.innerHTML=phrasePage(q); colCounts(); }
  else if(FILTER==='home'&&!q&&VIEW==='list'&&LIB.books.length){
    const B=LIB.books, groups=[...LIB.categories.map(c=>[c,'c:'+c,B.filter(b=>b.category===c)]),['未分類','none',B.filter(b=>!b.category)]].filter(g=>g[2].length);
    el.innerHTML=`<div class="page">${groups.map(([t,f,L])=>`<div class="hd" style="margin:${f===groups[0][1]?0:30}px 0 8px"><h1 style="font-size:19px">${esc(t)}</h1><span class="cnt note">${L.length} 本</span><button type="button" class="all small ghost" data-f="${esc(f)}">查看全部 ›</button></div><div data-drop="${esc(f)}" class="shelf" style="margin:0">${listHtml(L.sort(byOpened))}</div>`).join('')}
      <div style="padding-top:22px"><button type="button" class="small" data-addcat>＋ 新增分類</button></div></div>`;
  } else if(FILTER==='home'&&!q){
    const B=LIB.books, reading=B.filter(b=>(b.opened||b.lastPage)&&b.status!=='done').sort(byOpened);
    let h=heroHtml();
    if(B.length){
      // 書架：分類變成一排標籤，下面只放一排書（不用一直往下捲）
      const tabs=[...(reading.length?[['reading','閱讀中',reading]]:[]),['all','全部',B],['fav','★ 最愛',B.filter(b=>b.favorite)],['done','已完成',B.filter(b=>b.status==='done')],
        ...LIB.categories.map(c=>['c:'+c,c,B.filter(b=>b.category===c)]),['none','未分類',B.filter(b=>!b.category)]];

/* ---------- 匯入 PDF：在瀏覽器裡抽出文字（pdf.js），存到書庫 ---------- */
function linesOf(items){
  const lines=[]; let cur=null;
  for(const it of items){ if(typeof it.str!=='string') continue;
    const x=it.transform[4], y=it.transform[5], h=Math.abs(it.transform[3])||it.height||10;
    if(!it.str.trim()){ if(cur&&!/\s$/.test(cur.t)) cur.t+=' '; if(it.hasEOL) cur=null; continue; }
    if(cur&&Math.abs(y-cur.y)<h*0.6){ if(x>cur.xe+h*0.12&&!/\s$/.test(cur.t)&&!/^\s/.test(it.str)) cur.t+=' '; cur.t+=it.str; cur.xe=Math.max(cur.xe,x+(it.width||0)); }
    else { cur={y,x,h,t:it.str,xe:x+(it.width||0)}; lines.push(cur); }
    if(it.hasEOL) cur=null; }
  return lines.map(l=>(l.t=l.t.replace(/\s+/g,' ').trim(),l)).filter(l=>l.t); }
function parasOf(lines){
  if(!lines.length) return [];
  const gaps=[]; for(let i=1;i<lines.length;i++){ const g=lines[i-1].y-lines[i].y; if(g>0) gaps.push(g); }
  gaps.sort((a,b)=>a-b); const med=gaps.length?gaps[Math.floor(gaps.length/2)]:12;
  const maxW=Math.max(...lines.map(l=>l.xe-l.x)), left=Math.min(...lines.map(l=>l.x));
  const out=[]; let p='';
  lines.forEach((l,i)=>{ const pr=lines[i-1]; let brk=!pr;
    if(pr){ const g=pr.y-l.y;
      if(g<0||g>med*1.45) brk=true;                                         // 空一行、換欄
      else if(l.x>left+l.h*1.2&&l.x>pr.x+l.h*0.8&&/[.!?:"”’)]$/.test(pr.t)) brk=true;   // 首行縮排
      else if((pr.xe-pr.x)<maxW*0.72&&/[.!?:"”’]$/.test(pr.t)) brk=true;    // 上一行很短又是句尾
      else if(Math.abs(l.h-pr.h)>Math.max(pr.h,l.h)*0.25) brk=true; }      // 字的大小不同（標題）
    if(brk){ if(p) out.push(p); p=l.t; }
    else if(/[A-Za-z]-$/.test(p)&&/^[a-z]/.test(l.t)) p=p.slice(0,-1)+l.t;   // 行尾斷字 com- puter
    else p+=' '+l.t; });

  return out.map(s=>s.replace(/\s+/g,' ').trim()).filter(s=>s&&!/^(page\s*)?\d{1,4}$/i.test(s)); }
async function importFiles(files){
  files=[...files].filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');
  if(!files.length) return toast('只能匯入 PDF 檔');
  if(!window.pdfjsLib) return toast('PDF 元件沒載入（需要網路），請重新整理再試',5000);
  const cat=FILTER.startsWith('c:')&&!$('q').value?FILTER.slice(2):'';
  for(const [k,f] of files.entries()){
    const tag=files.length>1?`（${k+1}/${files.length}）`:'';
    try{
      toast(`<span class="spin"></span>上傳《${esc(f.name)}》${tag}`,0);
      const buf=await f.arrayBuffer();
      const meta=await api.post(`/api/upload?name=${encodeURIComponent(f.name)}&category=${encodeURIComponent(cat)}`,new Blob([buf]),true);
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
      const pages=[];
      for(let i=1;i<=pdf.numPages;i++){
        if(i%5===1||i===pdf.numPages) toast(`<span class="spin"></span>抽出文字《${esc(f.name)}》${tag} ${i}/${pdf.numPages} 頁`,0);
        const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); pages.push(parasOf(linesOf(tc.items))); pg.cleanup(); }

      const p1chars=(pages[0]||[]).join('').length;

        await p1.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82)); Object.assign(meta,await api.put(`/api/books/${meta.id}/cover`,blob,true)); }catch(e){ console.warn('cover',e); }

      pdf.destroy();
      toast(meta.hasText?`已匯入《${esc(meta.title)}》，共 ${meta.pages} 頁；背景會再解析版面（圖片、表格）${useAi?'、用 AI 填書名和分類':''}，可以先開始讀`:`已匯入《${esc(meta.title)}》，但這個 PDF 是掃描圖片、抽不出文字：只能看原始頁面`,meta.hasText?3000:6000);
    }catch(e){ console.error(e); toast('匯入失敗：'+esc(e.message),6000); }
  }

// 收藏的句型 → 比對用的正則（照搬雅思練習室：sth/sb、名詞這類空格、a / b 選一個、be 動詞各種形式、字尾變化）
const PH_GAP=/^(?:noun|nouns|verb|verbs|clause|object|someone|somebody|something|sb|sth|s|v|n|o|adj|adjective|adverb|percentage|number|figure|time|year|place|person|people|one's|reason|result|doing|ving|v-ing|to-v|subject|predicate|phrase|np)$/i;
function phrRegex(key){ key=String(key||'').trim(); if(!key||/[一-鿿]/.test(key.replace(/\+[^+]*[一-鿿][^+]*/g,''))) return null;
  const parts=key.split(/\s*\+\s*|\s*(?:\.\.\.|…)\s*/).map(x=>x.trim()), segs=[]; let lit=0;
  parts.forEach(p=>{ if(!p||/[一-鿿]/.test(p)||PH_GAP.test(p.replace(/[(),]/g,''))){ if(segs.length&&segs[segs.length-1]!=='GAP') segs.push('GAP'); return; }
    const ws=p.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean), out=[];
    for(let i=0;i<ws.length;i++){ let w=ws[i];
      if(ws[i+1]==='/'&&ws[i+2]){ const a=w,b=ws[i+2]; i+=2; out.push('(?:'+[a,b].map(x=>x.replace(/[^A-Za-z'’-]/g,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')'); lit++; continue; }

      if(/^(sth|sb|someone|somebody|something|one's|a\/an)$/i.test(w)){ out.push("(?:[\\w'’-]+\\s+){0,3}[\\w'’-]+"); continue; }
      const opt=/^\(.*\)$/.test(w); w=w.replace(/[()]/g,'');
      const m=w.match(/^([A-Za-z'’-]+?)\(([a-z]+)\)$/); let core=w.replace(/[^A-Za-z0-9'’-]/g,''); if(!core) continue;
      let rx=/^(is|are|was|were|be|been|being|am)$/i.test(core)?'(?:is|are|was|were|be|been|being|am)':core.replace(/[’']/g,"['’]")+(core.length>=4&&/[a-z]$/i.test(core)?'(?:s|es|d|ed|ing)?':'');

const vocOf=m=>{ const L=m.toLowerCase().replace(/’/g,"'"); return VOCM.find(v=>v.k===L)||VOCM.find(v=>L.startsWith(v.k)&&L.length-v.k.length<=3); };

  const e2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), ws=[...new Set(VOCM.map(v=>v.k))].sort((a,b)=>b.length-a.length);
  VOCRE=ws.length?new RegExp("(?<![A-Za-z-])(?<![A-Za-z]['’])("+ws.map(e2).join('|')+")(?:s|es|d|ed|ing|ly)?(?![A-Za-z-])(?!['’][A-Za-z])",'gi'):null;
  PHRM=PLIST.filter(x=>x.status==='done').map(x=>({x,re:phrRegex(x.key)||(String(x.text||'').split(/\s+/).length<=6?phrRegex(x.text):null)})).filter(o=>o.re);
  colCounts();
  if(BOOK&&MODE==='text'&&!$('vRead').hidden) renderPage();
}
// 一段文字裡收藏過的地方：[起, 迄, 'ph'|'vw', 編號]（句型優先，不重疊）
function ulRanges(text){
  const hits=[];
  PHRM.forEach((o,k)=>{ o.re.lastIndex=0; let m; while((m=o.re.exec(text))){ if(m[0].length&&m[0].length<160) hits.push([m.index,m.index+m[0].length,'ph',k]); if(!m[0].length) o.re.lastIndex++; } });
  hits.sort((a,b)=>a[0]-b[0]||(b[1]-b[0])-(a[1]-a[0])); const keep=[]; let end=-1; hits.forEach(h=>{ if(h[0]>=end){ keep.push(h); end=h[1]; } });
  if(VOCRE){ VOCRE.lastIndex=0; let m; while((m=VOCRE.exec(text))){ const s0=m.index,e0=s0+m[0].length, v=vocOf(m[0]); if(v&&!keep.some(h=>h[0]<e0&&h[1]>s0)) keep.push([s0,e0,'vw',VOCM.indexOf(v)]); } }
  return keep.sort((a,b)=>a[0]-b[0]); }
function colCounts(){ const v=$('vwN'), p=$('phN'); if(v) v.innerHTML=`<i>${(VLIST||[]).length}</i>`; if(p) p.innerHTML=`<i>${(PLIST||[]).length}</i>`; }

/* ---------- 小卡片 ---------- */
function hideCard(){ if(WCARD){ WCARD.remove(); WCARD=null; } }
function placeCard(d,rc){ document.body.appendChild(d); WCARD=d; const w=d.offsetWidth,h=d.offsetHeight;
  let x=rc?Math.max(12,Math.min(innerWidth-w-12,rc.left+rc.width/2-w/2)):(innerWidth-w)/2, y=rc?(rc.bottom+10+h<innerHeight?rc.bottom+10:Math.max(64,rc.top-h-10)):Math.max(64,(innerHeight-h)/2);
  d.style.left=x+'px'; d.style.top=y+'px'; }
document.addEventListener('mousedown',e=>{ if(WCARD&&!e.target.closest('.wcard')&&!e.target.closest('.hlpop')) hideCard(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&WCARD){ hideCard(); e.stopPropagation(); } },true);
function ctxBold(ctx,w){ const k=String(w||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); return esc(ctx).replace(new RegExp('('+k+"[a-z]{0,3})",'i'),'<b>$1</b>'); }
function meaningHtml(r){ if(!r) return '<div class="note"><span class="spin"></span>載入中…</div>'; const en=r.en||{};
  let h=r.t?`<div class="zhm">${esc(r.t)}</div>`:'<div class="note">本機字典查不到這個字，可以按「AI 解釋」。</div>';
  if(en.defs&&en.defs.length) h+=`<div><div class="lab">英英（Free Dictionary）</div><ol class="defs">${en.defs.slice(0,3).map(d=>`<li><em>${esc(d.pos)}</em>${esc(d.def)}${d.ex?` <span class="note">— ${esc(d.ex)}</span>`:''}</li>`).join('')}</ol></div>`;
  if(r.ex&&r.ex.length) h+=`<div><div class="lab">例句${r.exBy==='ai'?'（AI）':''}</div><div class="exs">${r.ex.map(([a,b])=>`<div>${esc(a)}${b?`<small>${esc(b)}</small>`:''}</div>`).join('')}</div></div>`;
  return h; }
async function saveWord(w,ctx){ try{ const j=await api.post('/api/vocab/add',{w,ctx:ctx||'',title:BOOK?BOOK.meta.title:'',book:BOOK?BOOK.meta.id:'',page:BOOK?PG:null}); const m=((j.meaning||{}).t||'').slice(0,60);
  toast((j.dup?'已經在字典裡了 ◆ ':'已收進字典 ◆ ')+`<b>${esc(w)}</b>`+(m?'：'+esc(m):''),4000); await loadMarks(); if(!$('vLib').hidden) renderLib(true); return j; }catch(e){ toast('收藏失敗：'+esc(e.message)); } }
async function savePhrase(text,ctx){ try{ const j=await api.post('/api/phrase/add',{text,ctx:ctx||'',title:BOOK?BOOK.meta.title:'',book:BOOK?BOOK.meta.id:'',page:BOOK?PG:null}); toast(j.dup?'這句已經收藏過了':'已收藏句子 ✦ AI 正在整理句型，好了會在文章裡畫底線'); await loadMarks(); if(!j.dup) phrWatch(j.id); }catch(e){ toast('收藏失敗：'+esc(e.message)); } }
function phrWatch(id,n){ n=n||0; if(n>60) return; setTimeout(async()=>{ try{ const L=await api.get('/api/phrases'), x=L.find(y=>y.id===id||String(y.id).startsWith(id+'-'));
  if(!x||x.status==='error') return loadMarks(); if(x.status==='done') return loadMarks(); }catch(e){} phrWatch(id,n+1); },n<5?2000:4000); }
// 點文章裡的底線
async function vwCard(v,rc){ hideCard(); const d=document.createElement('div'); d.className='wcard'; d.setAttribute('role','dialog'); let r=v.m?{t:v.m}:null, ai=null, conf=false;
  const draw=()=>{ const en=(r&&r.en)||{}; d.innerHTML=`<div class="hd"><span class="hw" style="color:var(--vw)">${esc(v.w)}</span><button type="button" class="ib ghost saybtn" data-say title="發音" aria-label="發音">${ICSAY}</button><span class="grow"></span><span class="tag vwc">◆ 我的單字</span></div>${en.phonetic?`<div class="phon">${esc(en.phonetic)}</div>`:''}
    ${meaningHtml(r)}${ai?`<div class="aibox">${ai==='busy'?'<span class="note"><span class="spin"></span>AI 解釋中…</span>':ai.err?`<span class="err">${esc(ai.err)}</span>`:`<div><b>${esc(ai.pos||'')}</b> ${esc(ai.zh||'')}</div>${ai.note?`<div class="note">${esc(ai.note)}</div>`:''}`}</div>`:''}
    ${v.note?`<div><div class="lab">我的筆記</div><div>${esc(v.note)}</div></div>`:''}
    ${v.ctx?`<div><div class="lab">收藏時的句子</div><div class="ctx">${ctxBold(v.ctx,v.k)}</div></div>`:''}
    <div class="note">${v.title?`收藏自〈${esc(v.title)}〉`:''}${v.forgot?`・已經忘記 ${v.forgot} 次`:''}</div>
    <div class="acts">${conf?`<span class="note">確定移除？所有書裡這個字的底線都會消失</span><button type="button" class="small" data-no>取消</button><button type="button" class="small danger" data-yes>移除</button>`:
      `<button type="button" class="small primary" data-rev title="又忘了：忘記次數 +1，字典頁會排在前面">${ICREV.replace('class="i"','class="i" style="display:inline-block;vertical-align:-3px;width:14px;height:14px"')} 加入複習</button><button type="button" class="small" data-aiex>AI 解釋</button><span class="grow"></span><button type="button" class="ib ghost" data-del title="移除收藏" aria-label="移除收藏">${ICTRASH}</button>`}</div>`;
    d.querySelector('[data-say]').onclick=()=>say(v.w,en.audio);
    const q=s=>d.querySelector(s);
    if(q('[data-rev]')) q('[data-rev]').onclick=async()=>{ const j=await api.post('/api/vocab/review',{k:v.k}); v.forgot=j.forgot; toast('已加入複習（忘記 '+j.forgot+' 次）'); draw(); };
    if(q('[data-aiex]')) q('[data-aiex]').onclick=async()=>{ ai='busy'; draw(); try{ ai=await api.post('/api/explain',{w:v.w,ctx:v._ctx||v.ctx}); }catch(e){ ai={err:e.message}; } draw(); };
    if(q('[data-del]')) q('[data-del]').onclick=()=>{ conf=true; draw(); };
    if(q('[data-no]')) q('[data-no]').onclick=()=>{ conf=false; draw(); };
    if(q('[data-yes]')) q('[data-yes]').onclick=async()=>{ await api.post('/api/vocab/del',{k:v.k}); hideCard(); toast('已移除'); await loadMarks(); if(!$('vLib').hidden) renderLib(true); }; };
  draw(); placeCard(d,rc);
  if(!r||!r.en){ try{ r=await api.get('/api/meaning?w='+encodeURIComponent(v.w)); }catch(e){} if(WCARD===d) draw(); } }
function phCard(x,rc,span){ hideCard(); const d=document.createElement('div'); d.className='wcard'; d.setAttribute('role','dialog'); let conf=false;
  // 這段底線對到的所有收藏（同一個句型可能收藏過好幾次）：刪的時候一起刪，底線才會真的消失
  const same=span?PHRM.filter(o=>{ o.re.lastIndex=0; const m=o.re.exec(span); return m&&m.index===0&&m[0].length===span.length; }).map(o=>o.x.id):[];
  const ids=[...new Set([x.id,...same])];
  const draw=()=>{ const ex=(x.examples||[])[0];
    d.innerHTML=`<div class="hd"><span class="key">${esc(x.key||x.text)}</span><span class="grow"></span><span class="tag phc">✦ 我的句子</span></div>
    ${x.zh?`<div class="zhm">${esc(x.zh)}</div>`:''}${x.pattern&&x.pattern!==x.key?`<div><div class="lab">句型</div><div style="color:var(--ph);font-family:var(--f-mono);font-size:13px">${esc(x.pattern)}</div></div>`:''}
    ${x.note?`<div class="note">${esc(x.note)}</div>`:''}${ex?`<div><div class="lab">例句</div><div class="exs"><div>${bold2(ex.en||'')}<small>${bold2(ex.zh||'')}</small></div></div></div>`:''}
    ${x.text&&x.text!==x.key?`<div><div class="lab">收藏的原句</div><div class="ctx">${esc(x.text)}</div></div>`:''}
    <div class="note">${x.title?`收藏自〈${esc(x.title)}〉`:''}${(x.more||[]).length?`・另外在 ${x.more.length} 個地方也收藏過`:''}</div>
    <div class="acts">${conf?`<span class="note">${ids.length>1?`這個句型收藏了 ${ids.length} 筆，會一起移除。確定？`:'確定移除這個句型？'}</span><button type="button" class="small" data-no>取消</button><button type="button" class="small danger" data-yes>移除</button>`:
      `<button type="button" class="small" data-say>${ICSAY.replace('class="i"','class="i" style="display:inline-block;vertical-align:-3px;width:14px;height:14px"')} 唸一次</button><span class="grow"></span><button type="button" class="ib ghost" data-del title="移除收藏" aria-label="移除收藏">${ICTRASH}</button>`}</div>`;
    const q=s=>d.querySelector(s);
    if(q('[data-say]')) q('[data-say]').onclick=()=>sayTTS(x.key||x.text);
    if(q('[data-del]')) q('[data-del]').onclick=()=>{ conf=true; draw(); };
    if(q('[data-no]')) q('[data-no]').onclick=()=>{ conf=false; draw(); };
    if(q('[data-yes]')) q('[data-yes]').onclick=async()=>{ try{ for(const id of ids) await api.post('/api/phrase/del',{id}); }catch(e){ return toast('移除失敗：'+esc(e.message),5000); } hideCard(); toast(ids.length>1?`已移除 ${ids.length} 筆`:'已移除'); await loadMarks(); if(!$('vLib').hidden) renderLib(true); }; };
  draw(); placeCard(d,rc); }

/* ---------- 字典頁、句子收藏頁 ---------- */
let VSORT=LS.get('vsort','forgot'), VSHOW=150, PSHOW=60;
function ieltsBtn(){ return `<button type="button" class="ib" data-ielts title="匯入收藏（重複的不會再加）" aria-label="匯入收藏"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>`; }
function vocabPage(q){
  const L=(VLIST||[]).filter(v=>!q||[v.w,v.m,v.ctx,v.title].join(' ').toLowerCase().includes(q));
  const S={forgot:(a,b)=>(b.forgot||0)-(a.forgot||0)||(b.forgotT||0)-(a.forgotT||0)||(b.t||0)-(a.t||0), t:(a,b)=>(b.t||0)-(a.t||0), az:(a,b)=>a.k.localeCompare(b.k)}[VSORT];
  L.sort(S);
  return `<div class="page"><div class="hd"><button type="button" class="ib" data-f="home" title="回首頁" aria-label="回首頁">${IC.l}</button><span style="color:var(--vw);display:flex">${ICV}</span><h1>我的字典</h1><span class="cnt note">${(VLIST||[]).length} 個單字</span><span class="grow"></span>
      <select id="vsort" aria-label="排序"><option value="forgot"${VSORT==='forgot'?' selected':''}>最常忘記</option><option value="t"${VSORT==='t'?' selected':''}>最新收藏</option><option value="az"${VSORT==='az'?' selected':''}>A → Z</option></select>${ieltsBtn()}</div>
    <form class="dictbox" id="dictF"><input type="text" id="dictQ" placeholder="新增單字：輸入英文單字或片語，按 Enter 收進字典" aria-label="新增單字" autocomplete="off" spellcheck="false"><button class="primary">＋ 新增</button></form>
    ${q?`<div class="note" style="margin-bottom:8px">篩選「${esc(q)}」：${L.length} 個</div>`:''}
    ${L.length?`<table class="vt"><colgroup><col style="width:17%"><col style="width:30%"><col class="hm"><col class="hm" style="width:14%"><col style="width:9%"><col style="width:76px"></colgroup>
      <thead><tr><th>單字</th><th>中文</th><th class="hm">收藏時的句子</th><th class="hm">來源</th><th style="text-align:center">忘記</th><th></th></tr></thead><tbody>
      ${L.slice(0,VSHOW).map(v=>`<tr data-vk="${esc(v.k)}"><td><span class="w" data-vopen>${esc(v.w)}</span></td><td><div class="m">${esc(v.m||'—')}</div></td><td class="hm"><div class="c">${v.ctx?ctxBold(v.ctx,v.k):''}</div></td>
        <td class="hm src">${esc(v.title||'')}</td><td class="fg">${v.forgot||''}</td><td><span class="row" style="gap:0;flex-wrap:nowrap"><button type="button" class="ib ghost" data-vsay title="發音" aria-label="發音">${ICSAY}</button><button type="button" class="ib ghost" data-vrev title="加入複習（忘記 +1）" aria-label="加入複習">${ICREV}</button></span></td></tr>`).join('')}</tbody></table>
      ${L.length>VSHOW?`<button type="button" class="morebtn" data-vmore>再顯示 150 個（還有 ${L.length-VSHOW} 個）</button>`:''}`:`<div class="empty"><b>${q?'沒有符合的單字':'還沒有收藏單字'}</b><span class="note">讀書時選一個字，按 ◆ 就會收藏到這裡；收藏的字在所有書裡都會畫青綠色底線。</span>${q?'':ieltsBtn()}</div>`}</div>`; }
function phrasePage(q){
  const L=(PLIST||[]).filter(x=>!q||[x.text,x.key,x.zh,x.pattern,x.title].join(' ').toLowerCase().includes(q));
  const card=x=>{ const ex=(x.examples||[])[0], st=x.status;
    return `<div class="pcard${st==='error'?' err':st!=='done'?' run':''}" data-pid="${esc(x.id)}">
      <div class="key">${esc(x.key||x.text)}</div>
      ${st==='done'?`${x.zh?`<div class="pzh">${esc(x.zh)}</div>`:''}${x.pattern&&x.pattern!==x.key?`<div class="pat">${esc(x.pattern)}</div>`:''}${x.note?`<div class="note">${esc(x.note)}</div>`:''}${ex?`<div class="ex">${bold2(ex.en||'')}<small>${bold2(ex.zh||'')}</small></div>`:''}`
        :st==='error'?`<div class="err">${esc(x.error||'AI 分析失敗')}</div>`:'<div class="note"><span class="spin"></span>AI 分析中…</div>'}
      ${x.text&&x.text!==x.key?`<div class="orig">${esc(x.text)}</div>`:''}
      <div class="from">${x.title?`〈${esc(x.title)}〉`:''}</div>
      <div class="acts">${st==='error'?`<button type="button" class="small" data-pretry>重新分析</button>`:''}<button type="button" class="ib ghost" data-psay title="唸一次" aria-label="唸一次">${ICSAY}</button><button type="button" class="ib ghost" data-pdel title="移除" aria-label="移除">${ICTRASH}</button></div></div>`; };
  return `<div class="page"><div class="hd"><button type="button" class="ib" data-f="home" title="回首頁" aria-label="回首頁">${IC.l}</button><span style="color:var(--ph);display:flex">${ICP}</span><h1>句子收藏</h1><span class="cnt note">${(PLIST||[]).length} 句</span><span class="grow"></span>${ieltsBtn()}</div>
    <p class="note" style="margin:-8px 0 18px">讀書時選一段句子按 ✦ 收藏，AI 會抽出值得學的片語、句型，附上中文和例句；之後所有書裡出現同樣的句型都會畫紫色底線。用上方搜尋框可以篩選。</p>
    ${q?`<div class="note" style="margin-bottom:8px">篩選「${esc(q)}」：${L.length} 句</div>`:''}
    ${L.length?`<div class="pwall">${L.slice(0,PSHOW).map(card).join('')}</div>${L.length>PSHOW?`<button type="button" class="morebtn" data-pmore>再顯示 60 句（還有 ${L.length-PSHOW} 句）</button>`:''}`
      :`<div class="empty"><b>${q?'沒有符合的句子':'還沒有收藏句子'}</b>${q?'':ieltsBtn()}</div>`}</div>`; }
async function ieltsImport(){
  let info; try{ info=await api.get('/api/ielts-import'); }catch(e){ return toast(esc(e.message)); }
  if(!info.found) return toast('找不到可以匯入的收藏',4000);
  if(!confirm(`匯入收藏？\n單字 ${info.vocab} 個、句子 ${info.phrases} 句（已經有的不會重複加）`)) return;
  try{ toast('<span class="spin"></span>匯入中…',0); const j=await api.post('/api/ielts-import',{}); await loadMarks(); renderLib(true); toast(j.vocab||j.phrases?`匯入完成：新增單字 ${j.vocab} 個、句子 ${j.phrases} 句`:'都已經匯入過了，沒有新的',4000); }catch(e){ toast('匯入失敗：'+esc(e.message),5000); } }
$('vLib').addEventListener('click',async e=>{ const t=e.target;
  if(t.closest('[data-ielts]')) return ieltsImport();
  if(t.closest('[data-vmore]')){ VSHOW+=150; return renderLib(true); }
  if(t.closest('[data-pmore]')){ PSHOW+=60; return renderLib(true); }
  const vr=t.closest('[data-vk]');
  if(vr){ const v=(VLIST||[]).find(x=>x.k===vr.dataset.vk); if(!v) return;
    if(t.closest('[data-vsay]')) return sayTTS(v.w);
    if(t.closest('[data-vrev]')){ const j=await api.post('/api/vocab/review',{k:v.k}); v.forgot=j.forgot; toast(`「${esc(v.w)}」忘記 ${j.forgot} 次`); return renderLib(true); }
    if(t.closest('[data-vopen]')) return vwCard(v,t.getBoundingClientRect()); }
  const pc=t.closest('[data-pid]');
  if(pc){ const x=(PLIST||[]).find(y=>y.id===pc.dataset.pid); if(!x) return;
    if(t.closest('[data-psay]')) return sayTTS(x.key||x.text);
    if(t.closest('[data-pretry]')){ await api.post('/api/phrase/retry',{id:x.id}); x.status='pending'; renderLib(true); return phrWatch(x.id); }
    if(t.closest('[data-pdel]')){ if(!confirm('移除這個句子收藏？')) return; await api.post('/api/phrase/del',{id:x.id}); await loadMarks(); return renderLib(true); } }
});
$('vLib').addEventListener('change',e=>{ if(e.target.id==='vsort'){ VSORT=e.target.value; LS.set('vsort',VSORT); renderLib(true); } });
$('vLib').addEventListener('submit',async e=>{ if(e.target.id!=='dictF') return; e.preventDefault(); const w=$('dictQ').value.trim(); if(!w) return; $('dictQ').value=''; await saveWord(w,''); });

/* ---------- 開始 ---------- */
loadMarks();
loadLib().then(()=>{ const m=location.hash.match(/book=([a-z0-9]+)/); if(m&&LIB.books.some(b=>b.id===m[1])) openBook(m[1]); }).catch(e=>{ $('vLib').innerHTML=`<div class="empty" style="margin-top:40px"><b>連不到 Readiverse 伺服器</b><span class="note">請用「開啟Readiverse.command」打開。${esc(e.message)}</span></div>`; });
</script>
