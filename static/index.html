<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><script>try{var t=localStorage.getItem("rv.theme");if(t==="dark"||t==="system")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Readiverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#e2e2e2; --soft:#f4f4f4;
  --bad:#b3261e; --ok:#2f6b4f;
  --h1:#ffeb70; --h2:#bfe8c9; --h3:#c6dcff; --h4:#ffc9dd;
  --f-ui:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif; --f-zh:"Noto Sans TC","PingFang TC",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-read:"Source Serif 4",Georgia,"Noto Serif TC",serif;
  --lw:55%; --fs:18px;
}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--bg:#000;--surface:#0a0a0a;--ink:#fff;--muted:#9a9a9a;--line:#2a2a2a;--soft:#161616;--bad:#ff4d4f;--ok:#34d058;--h1:#6b5a00;--h2:#164a28;--h3:#1d3a66;--h4:#5e1f37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surface:#0a0a0a;--ink:#fff;--muted:#9a9a9a;--line:#2a2a2a;--soft:#161616;--bad:#ff4d4f;--ok:#34d058;--h1:#6b5a00;--h2:#164a28;--h3:#1d3a66;--h4:#5e1f37;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);height:100%}
body{font-family:var(--f-ui);font-size:15px;line-height:1.6}
button,select,input,textarea{font:inherit;color:var(--ink)}
button,select,.filebtn,input[type=text],input[type=search],input[type=number]{font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;min-height:34px}
button,select,.filebtn{cursor:pointer}
button:hover,.filebtn:hover{border-color:var(--ink)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.small{min-height:28px;padding:2px 9px;font-size:12px}
.ghost{border-color:transparent;background:transparent}
.ghost:hover{background:var(--soft);border-color:transparent}
.on{background:var(--soft)!important;border-color:var(--ink)!important;font-weight:600}
.filebtn{display:inline-flex;align-items:center;gap:6px}
.filebtn input{display:none}
.note{color:var(--muted);font-size:13px}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
svg.i{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
textarea{width:100%;line-height:1.6;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);resize:vertical;font-size:14px;font-family:var(--f-zh)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* ---------- 頂部導覽 ---------- */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:6px 18px;padding:0 clamp(16px,3.5vw,48px);height:56px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-read);font-weight:600;font-size:21px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;padding:0;min-height:0;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.nav{display:flex;gap:2px}
.nav button{border:0;background:none;min-height:32px;padding:4px 10px;font-size:14px;color:var(--muted);border-radius:6px}
.nav button:hover{color:var(--ink);background:var(--soft)}
.nav button.on{color:var(--ink);font-weight:600;background:none!important;border:0!important}
@media (max-width:900px){.nav{display:none}}
.srch{position:relative;display:flex;align-items:center}
.seg.ic{border-radius:8px}.seg.ic .ib{width:34px;height:32px}
.filebtn.ib{width:34px;height:34px;min-height:0;justify-content:center}
.srch svg{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.srch input{padding-left:32px;width:200px;border-radius:999px;background:var(--soft);border-color:transparent;transition:width .2s}
.srch input:focus{width:260px;background:var(--bg);border-color:var(--line)}
@media (max-width:640px){.top{gap:8px}.srch input{width:96px}.srch input:focus{width:140px}.top .seg.ic,#themeBtn{display:none}.brand{font-size:18px}}
@media (max-width:400px){.brand{font-size:0;gap:0}.brand .dot{width:14px;height:14px}}
.avb{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-family:var(--f-zh);font-size:15px}
.avb:hover{outline:2px solid var(--acc);outline-offset:2px}
.menu{position:absolute;right:0;top:44px;z-index:30;width:280px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:14px;display:flex;flex-direction:column;gap:12px}
.menu .who{display:flex;gap:10px;align-items:center}
.menu .who .avb{width:40px;height:40px;font-size:17px;pointer-events:none}
.menu .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:600;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}
.menu .mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 6px;min-height:32px;border-radius:6px;font-size:14px}
.menu .mi:hover{background:var(--soft)}
.catrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.catrow input{flex:1;min-width:0}

/* ---------- 首頁：大看板＋一排一排的書 ---------- */
:root{--acc:#c2410c;--gx:clamp(16px,3.5vw,48px)}
:root[data-theme="dark"]{--acc:#fb923c}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--acc:#fb923c}}
#vLib{padding-bottom:60px}
.hero{position:relative;overflow:hidden;min-height:min(440px,62vh);display:flex;align-items:flex-end;padding:56px var(--gx) 44px;isolation:isolate}
.hero .bg{position:absolute;inset:-40px;z-index:-2;background-size:cover;background-position:center;filter:blur(38px) saturate(1.3);opacity:.55;transform:scale(1.1)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--bg) 18%,color-mix(in srgb,var(--bg) 55%,transparent) 55%,transparent),linear-gradient(0deg,var(--bg),transparent 45%)}
.hero .in{display:flex;align-items:flex-end;gap:40px;width:100%}
.hero .tx{flex:1;min-width:0;max-width:640px;display:flex;flex-direction:column;gap:12px}
.hero .kick{font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--acc);text-transform:uppercase}
.hero h1{font-family:var(--f-read);font-weight:600;font-size:clamp(30px,4.6vw,54px);line-height:1.08;margin:0;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px}
.hero .pg{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted);max-width:420px}
.hero .pg .bar{flex:1;height:4px}
.hero .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero .btns button,.hero .btns .filebtn{min-height:44px;padding:8px 22px;font-size:15px;font-weight:600;border-radius:8px;display:inline-flex;align-items:center;gap:8px}
.hero .btns .sec{background:color-mix(in srgb,var(--ink) 10%,transparent);border-color:transparent}
.hero .btns .sec:hover{background:color-mix(in srgb,var(--ink) 16%,transparent)}
.hero .poster{flex:none;margin-left:auto;margin-right:clamp(0px,4vw,60px);width:clamp(150px,17vw,230px);aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.28);background:var(--soft);cursor:pointer;transform:rotate(2deg);transition:transform .25s}
.hero .poster:hover{transform:rotate(0) scale(1.02)}
.hero .poster img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:700px){.hero .poster{display:none}.hero{min-height:0;padding-top:40px}}
.shelf{margin-top:30px;position:relative}
.shelf .hd{display:flex;align-items:baseline;gap:10px;padding:0 var(--gx);margin-bottom:10px}
.shelf h2{font-family:var(--f-zh);font-size:19px;font-weight:700;margin:0}
.shelf .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.shelf .all{border:0;background:none;min-height:0;padding:2px 4px;font-size:13px;color:var(--muted);opacity:0;transition:opacity .15s}
.shelf:hover .all,.shelf .all:focus-visible{opacity:1;color:var(--acc)}
@media (hover:none){.shelf .all{opacity:1}}
.shelf.drop .track,.shelf.drop table{outline:2px dashed var(--acc);outline-offset:4px;border-radius:8px}
.page .all{opacity:1;color:var(--muted);border:0}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 var(--gx);padding:14px var(--gx) 18px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arr{position:absolute;top:50px;bottom:56px;width:var(--gx);min-width:36px;z-index:4;border:0;border-radius:0;background:color-mix(in srgb,var(--bg) 75%,transparent);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;padding:0;min-height:0}
.arr.l{left:0}.arr.r{right:0}
.shelf:hover .arr:not([disabled]){opacity:1}
.arr[disabled]{display:none}
.arr svg{width:26px;height:26px}
@media (hover:none){.arr{display:none}}
.dropzone{flex:none;width:168px;aspect-ratio:2/3;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--muted);font-size:13px}
.pc{flex:none;width:168px;scroll-snap-align:start;position:relative;cursor:pointer;outline:none}
@media (max-width:640px){.pc,.dropzone{width:124px}}
.pc .po{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--soft);border:1px solid var(--line);transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s}
.pc .po img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.pc .fav,.pc .pb,.pc .ov{z-index:2}
.pc .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:var(--f-read);font-size:16px;line-height:1.3;color:var(--ink);background:linear-gradient(160deg,var(--soft),color-mix(in srgb,var(--acc) 14%,var(--soft)))}
.pc .fav{position:absolute;top:6px;left:8px;font-size:14px;color:#f5b301;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.pc .pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.25)}
.pc .pb i{display:block;height:100%;background:var(--acc)}
.pc .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 10px;background:linear-gradient(0deg,rgba(0,0,0,.86),rgba(0,0,0,.35) 55%,transparent);color:#fff;opacity:0;transition:opacity .2s}
.pc .ov .t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc .ov .m{font-size:11px;opacity:.85;display:flex;flex-wrap:wrap;gap:4px 8px}
.pc .ov .b{display:flex;gap:6px}
.pc .ov .b button{width:32px;height:32px;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);color:#fff}
.pc .ov .b button.go{background:#fff;color:#111;border-color:#fff}
.pc .ov .b button:hover{border-color:#fff;background:rgba(255,255,255,.3)} .pc .ov .b button.go:hover{background:#e8e8e8}
.pc:hover .po,.pc:focus-visible .po{transform:scale(1.07);box-shadow:0 14px 30px rgba(0,0,0,.28);z-index:2}
.pc:hover .ov,.pc:focus-visible .ov{opacity:1}
.pc:focus-visible .po{outline:2px solid var(--acc);outline-offset:2px}
.pc .nm{margin-top:8px;font-size:13px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
/* 查看全部／搜尋結果 */
.page{padding:28px var(--gx) 0}
.page .hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px}
.page h1{font-family:var(--f-zh);font-size:26px;margin:0}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 16px}
.wall .pc{width:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:32px;padding:4px 10px}
.seg button.on{border:0!important}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.pill{display:inline-block;font-size:11px;font-weight:600;line-height:1.3;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
table.list{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
table.list td{overflow:hidden;text-overflow:ellipsis}
.lt{display:flex;align-items:center;gap:12px}
.lt .th{flex:none;width:30px;height:42px;border-radius:3px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.lt .th img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:760px){table.list col.hm{width:0!important}}
table.list th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
table.list td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
table.list tr.r{cursor:pointer}
table.list tr.r:hover td{background:var(--soft)}
table.list td.mono{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:760px){table.list .hm{display:none}}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:48px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;margin:0 var(--gx)}
.empty b{font-family:var(--f-zh);font-size:17px}
#dropMask{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);display:flex;align-items:center;justify-content:center;border:3px dashed var(--ink);font-size:20px;font-weight:600;font-family:var(--f-zh)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast .spin{border-color:color-mix(in srgb,var(--bg) 40%,transparent);border-top-color:var(--bg)}
dialog{border:1px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{font-family:var(--f-zh);font-size:17px;margin:0 0 14px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld input,.fld select{width:100%}
.danger{color:var(--bad)}
.danger:hover{border-color:var(--bad)}

/* ---------- 閱讀 ---------- */
#vRead{height:calc(100vh - 56px);display:flex;flex-direction:column}
#vRead .bar i{background:var(--ink)}
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line)}
.rbar .seg .ib{border-radius:0;height:32px;border:0}
#zhBtn.on,#allBtn.on{background:var(--ink)!important;color:var(--bg);border-color:var(--ink)!important}
.rbar .bt{font-family:var(--f-read);font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.pgnav{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:13px}
.pgnav input{width:64px;text-align:center;min-height:30px;padding:2px 4px;font-family:var(--f-mono)}
.ib{width:32px;height:32px;min-height:0;padding:0;display:inline-flex;align-items:center;justify-content:center}
#rs{flex:1;min-height:0;overflow:auto;position:relative}
.sheet{position:relative;padding:0 clamp(12px,3vw,40px) 40px}
.sheet.tn{animation:tn .22s ease-out} .sheet.tp{animation:tp .22s ease-out}
@keyframes tn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes tp{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sheet.tn,.sheet.tp{animation:none}}
.r2{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);column-gap:0}
.r2>.L{padding:0 36px 0 0;min-width:0}
.r2>.R{padding:0 0 0 18px;min-width:0;display:flex;flex-direction:column;gap:6px}
.gut{position:absolute;top:0;bottom:0;left:calc(clamp(12px,3vw,40px) + (100% - 2 * clamp(12px,3vw,40px)) * var(--lwn));width:9px;margin-left:-4px;cursor:col-resize;z-index:3}
.gut::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--line)}
.gut:hover::after,.gut.drag::after{width:2px;background:var(--ink)}
.rhead{padding:22px 0 10px}
.rhead .L{display:flex;align-items:flex-end}
.pgsep{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.rhead textarea{min-height:34px;font-size:13px;padding:5px 10px;border-color:transparent;background:var(--soft);resize:none}
.rhead textarea:focus{border-color:var(--line);background:var(--bg)}
.para{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;border-radius:6px;transition:background .15s;max-width:860px;margin-left:auto;margin-right:auto}
.r2{padding:6px 0}
.para .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:.45em;text-align:right;user-select:none}
.ptx{font-family:var(--f-read);font-size:var(--fs);line-height:1.75;hyphens:auto}
.r2.hov .para,.r2:focus-within .para{background:color-mix(in srgb,var(--soft) 70%,transparent)}
.para.flash{animation:fl 1s}
@keyframes fl{0%,40%{background:color-mix(in srgb,var(--ink) 14%,transparent)}100%{background:transparent}}
.zh{grid-column:2;font-family:var(--f-zh);font-size:calc(var(--fs) - 3px);line-height:1.8;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:6px 0 4px;outline:none;border-radius:0 4px 4px 0}
.zh:focus{background:var(--soft);color:var(--ink)}
.zh.wait{font-style:italic}
mark.hl{color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
mark.c1{background:var(--h1)} mark.c2{background:var(--h2)} mark.c3{background:var(--h3)} mark.c4{background:var(--h4)}
mark.hl.lit{box-shadow:0 0 0 2px var(--ink)}
.addn{align-self:flex-start;opacity:0;transition:opacity .12s;border:1px dashed var(--line);background:none;color:var(--muted);font-size:12px;min-height:26px;padding:2px 9px}
.r2.hov .addn,.addn:focus-visible{opacity:1}
@media (hover:none){.addn{opacity:.7}}
.notext{border:1.5px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
#pdfView{display:flex;justify-content:center;padding:22px 12px 40px}
#pdfView canvas{max-width:100%;height:auto;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.rfoot{display:flex;align-items:center;gap:14px;max-width:780px;margin:36px auto 0;padding-top:18px;border-top:1px solid var(--line)}
.rfoot .bar{flex:1}
.rfoot .pc{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.hcard{border:1px solid var(--line);border-left:4px solid var(--hc,var(--line));border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.hcard .q{font-family:var(--f-read);font-size:13px;line-height:1.45;cursor:pointer;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hcard .q:hover{color:var(--ink)}
.hcard .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.hcard textarea{min-height:44px;font-size:14px;padding:6px 8px;border-color:transparent;background:var(--soft);resize:none;overflow:hidden}
.hcard textarea:focus{border-color:var(--line);background:var(--bg)}
.hcard .x{margin-left:auto;border:0;background:none;color:var(--muted);min-height:0;padding:2px 4px}
.hcard .x:hover{color:var(--bad)}
.hc0{--hc:var(--ink)} .hc1{--hc:var(--h1)} .hc2{--hc:var(--h2)} .hc3{--hc:var(--h3)} .hc4{--hc:var(--h4)}
.hcard.focus,.hcard.lit{border-color:var(--ink)}
@media (max-width:860px){.r2{grid-template-columns:minmax(0,1fr)} .r2>.L{padding:0} .r2>.R{padding:6px 0 0 32px} .r2>.R:empty{display:none} .gut{display:none} .addn{opacity:.7}}
#allPane{position:fixed;top:56px;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);border-left:1px solid var(--ink);z-index:20;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
#allPane .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
#allPane .bd{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.pghd{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:6px;cursor:pointer}
.pghd:hover{color:var(--ink)}
.hlpop{position:fixed;z-index:30;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--ink);border-radius:9px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.hlpop .sw{width:22px;height:22px;min-height:0;padding:0;border-radius:50%;border:1px solid var(--line)}
.hlpop .sw:hover{border-color:var(--ink);transform:scale(1.1)}
.hlpop .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.sw1{background:var(--h1)!important}.sw2{background:var(--h2)!important}.sw3{background:var(--h3)!important}.sw4{background:var(--h4)!important}
.toc{position:absolute;z-index:25;background:var(--surface);border:1px solid var(--ink);border-radius:10px;padding:6px;max-height:60vh;overflow:auto;width:min(360px,calc(100vw - 32px));box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toc button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 8px;min-height:0;font-size:13px;border-radius:5px}
.toc button:hover{background:var(--soft)}
.toc .pn{float:right;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:10px}
.err{color:var(--bad);font-size:13px}
.aist{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.aist.bad{color:var(--bad)}
.stor{display:flex;flex-direction:column;gap:6px}
.stor label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer}
.stor label:has(input:checked){border-color:var(--ink)}
.stor small{display:block;color:var(--muted);font-size:12px;word-break:break-all}
</style></head>
<body>
<div class="top">
  <button type="button" class="brand" id="home" title="回到首頁"><span class="dot"></span>Readiverse</button>
  <nav class="nav" id="nav" aria-label="書庫">
    <button type="button" data-f="home">首頁</button><button type="button" data-f="reading">閱讀中</button><button type="button" data-f="fav">最愛</button><button type="button" data-f="done">讀完</button><button type="button" data-f="all">全部書籍</button>
  </nav>
  <span class="grow"></span>
  <span id="libTools" class="row" style="gap:10px;flex-wrap:nowrap">
    <label class="srch"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" id="q" placeholder="書名、作者、標籤" aria-label="搜尋書"></label>
    <div class="seg ic" role="group" aria-label="顯示方式"><button type="button" data-view="grid" class="ib" title="卡片模式" aria-label="卡片模式"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></button><button type="button" data-view="list" class="ib" title="清單模式" aria-label="清單模式"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></button></div>
    <label class="filebtn primary ib imp" title="匯入 PDF（也可以直接拖進視窗）" aria-label="匯入 PDF" style="border-radius:50%;padding:0"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg><input type="file" id="fileIn" accept="application/pdf,.pdf" multiple></label>
  </span>
  <button type="button" class="ib ghost" id="themeBtn" title="切換淺色／深色" aria-label="切換淺色／深色"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <span style="position:relative"><button type="button" class="avb" id="avBtn" aria-haspopup="true" aria-expanded="false" title="帳號與設定">R</button><div class="menu" id="menu" hidden></div></span>
</div>

<!-- ===== 書庫 ===== -->
<section id="vLib"></section>

<!-- ===== 閱讀 ===== -->
<section id="vRead" hidden>
  <div class="rbar">
    <button type="button" class="ib" id="back" title="回到書庫（Esc）" aria-label="回到書庫"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="bt" id="rTitle"></span>
    <span style="position:relative"><button type="button" class="ib" id="tocBtn" hidden title="目錄" aria-label="目錄"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></button><div class="toc" id="toc" hidden></div></span>
    <span id="rAi"></span>
    <span class="grow"></span>
    <button type="button" class="ib" id="zhBtn" title="中文對照：在每段英文底下顯示 AI 翻譯" aria-label="中文對照" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h8M8 3v2M5.5 5c.5 3 2.5 5.5 5.5 6.5M10.5 5c-.6 3.2-2.8 5.7-6 7"/><path d="M13 21l4-9 4 9M14.4 18h5.2"/></svg></button>
    <div class="seg" role="group" aria-label="左邊顯示">
      <button type="button" class="ib" data-mode="text" title="文字模式：可以畫螢光筆、寫筆記" aria-label="文字模式"><svg class="i" viewBox="0 0 24 24"><path d="M5 6h14M5 10h14M5 14h14M5 18h9"/></svg></button><button type="button" class="ib" data-mode="pdf" title="原始 PDF 頁面" aria-label="原始 PDF 頁面"><svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><rect x="8" y="11" width="8" height="6" rx="1"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="字體大小"><button type="button" id="fsDn" title="字小一點">A−</button><button type="button" id="fsUp" title="字大一點">A＋</button></div>
    <button type="button" class="ib" id="allBtn" title="全書筆記：整本書的螢光筆和筆記" aria-label="全書筆記"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg></button>
    <div class="pgnav">
      <button type="button" class="ib" id="prev" title="上一頁（←）" aria-label="上一頁"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <input type="number" id="pgIn" min="1" aria-label="頁碼"><span>/ <span id="pgN">0</span></span>
      <button type="button" class="ib" id="next" title="下一頁（→）" aria-label="下一頁"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </div>
  <div id="rs">
    <div class="sheet" id="sheet"></div>
    <div id="pdfView" hidden></div>
  </div>
  <aside id="allPane" hidden aria-label="全書筆記">
    <div class="hd"><b style="font-family:var(--f-zh)">全書筆記</b><span class="grow"></span><span id="allTools" class="row"></span><button type="button" class="ib ghost" id="allX" title="關閉" aria-label="關閉">×</button></div>
    <div class="bd" id="allBody"></div>
  </aside>
</section>

<div id="dropMask" hidden>放開就匯入 PDF</div>
<div class="toast" id="toast" hidden></div>
<dialog id="dlg"></dialog>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){ try{ const v=localStorage.getItem('rv.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('rv.'+k,JSON.stringify(v)); }catch(e){} }};
const api={
  async req(m,u,body,raw){ const o={method:m,headers:{}}; if(body!==undefined){ if(raw){ o.body=body; } else { o.body=JSON.stringify(body); o.headers['Content-Type']='application/json'; } }
    const r=await fetch(u,o); let j=null; try{ j=await r.json(); }catch(e){} if(!r.ok) throw new Error((j&&j.error)||('HTTP '+r.status)); return j; },
  get:u=>api.req('GET',u), put:(u,b,raw)=>api.req('PUT',u,b,raw), post:(u,b,raw)=>api.req('POST',u,b,raw), patch:(u,b)=>api.req('PATCH',u,b), del:u=>api.req('DELETE',u)};
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const STATUS={unread:'未讀',reading:'閱讀中',done:'讀完'};
let toastT=null;
function toast(html,ms){ const t=$('toast'); t.innerHTML=html; t.hidden=false; clearTimeout(toastT); if(ms!==0) toastT=setTimeout(()=>t.hidden=true,ms||2600); }

/* ---------- 主題 ---------- */
function isDark(){ const t=document.documentElement.getAttribute('data-theme'); return t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches); }
function setTheme(t){ if(t==='dark'||t==='system') document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme'); try{ localStorage.setItem('rv.theme',t||'light'); }catch(e){} }
$('themeBtn').onclick=()=>setTheme(isDark()?'light':'dark');

/* =====================================================================
   書庫
   ===================================================================== */
let LIB={books:[],categories:[]}, FILTER=LS.get('filter2','home'), VIEW=LS.get('view2','grid'), SORT=LS.get('sort','opened');
async function loadLib(){ LIB=await api.get('/api/library'); renderLib(); }
function aiTag(b){ const a=b.ai||{}; if(a.status==='running'||a.status==='queued') return `<span class="aist"><span class="spin"></span>AI 整理中${a.total?` ${Math.min(a.next||0,a.total)}/${a.total} 頁`:''}</span>`;
  if(a.status==='error') return `<span class="aist bad" title="${esc(a.error||'')}">AI 整理失敗</span>`; return ''; }
let libPollT=null;
function pollLib(){ clearTimeout(libPollT); if(LIB.books.some(b=>['running','queued'].includes((b.ai||{}).status))) libPollT=setTimeout(async()=>{ if(!$('vLib').hidden){ try{ LIB=await api.get('/api/library'); renderLib(true); }catch(e){} } else pollLib(); },4000); }
function prog(b){ return b.pages?Math.min(1,(b.lastPage+1)/b.pages):0; }
const byOpened=(a,b)=>(b.opened||b.added)-(a.opened||a.added);
const SORTS={opened:byOpened,added:(a,b)=>b.added-a.added,title:(a,b)=>a.title.localeCompare(b.title,'zh-Hant'),progress:(a,b)=>prog(b)-prog(a)};
function inFilter(b,f){ return f==='fav'?b.favorite:f==='reading'?b.status==='reading':f==='done'?b.status==='done':f==='none'?!b.category:f.startsWith('c:')?b.category===f.slice(2):true; }
function filterName(f){ return f==='all'?'全部書籍':f==='fav'?'我的最愛':f==='reading'?'閱讀中':f==='done'?'讀完':f==='none'?'未分類':f.slice(2); }
const coverUrl=b=>`/books/${b.id}/cover.jpg?v=${b.added}`;
const IC={play:'<svg class="i" viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M7 4.5v15l13-7.5z"/></svg>',
  more:'<svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  star:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  l:'<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>', r:'<svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>'};
function posterCard(b){
  const p=Math.round(prog(b)*100), started=b.opened||b.lastPage;
  return `<div class="pc" role="button" tabindex="0" data-open="${b.id}" draggable="true" data-drag="${b.id}" aria-label="打開 ${esc(b.title)}">
    <div class="po"><div class="ph">${esc(b.title)}</div><img src="${coverUrl(b)}" alt="" loading="lazy" onerror="this.remove()">${b.favorite?'<span class="fav" aria-label="最愛">★</span>':''}
      ${started&&b.status!=='done'?`<div class="pb"><i style="width:${p}%"></i></div>`:''}
      <div class="ov"><div class="t">${esc(b.title)}</div><div class="m">${b.pages?`<span>${started?`${b.lastPage+1}/${b.pages} 頁`:`${b.pages} 頁`}</span>`:''}${b.notes?`<span>✎ ${b.notes}</span>`:''}${b.category?`<span>${esc(b.category)}</span>`:''}</div>
        <div class="b"><button type="button" class="go" data-open="${b.id}" title="${started?'繼續閱讀':'開始閱讀'}" aria-label="${started?'繼續閱讀':'開始閱讀'}">${IC.play}</button><button type="button" data-fav="${b.id}" title="${b.favorite?'取消最愛':'加到最愛'}" aria-label="${b.favorite?'取消最愛':'加到最愛'}" style="${b.favorite?'color:#f5b301':''}">${IC.star}</button><button type="button" data-edit="${b.id}" title="詳細資料" aria-label="詳細資料">${IC.more}</button></div></div>
    </div>
    <div class="nm">${esc(b.title)}</div><div class="sub">${b.author?`<span>${esc(b.author)}</span>`:''}${aiTag(b)}</div></div>`; }
function shelf(title,f,L,drop){
  if(!L.length&&!drop) return '';
  return `<section class="shelf"${drop?` data-drop="${esc(f)}"`:''}><div class="hd"><h2>${esc(title)}</h2><span class="cnt">${L.length}</span>${L.length?`<button type="button" class="all" data-f="${esc(f)}">查看全部 ›</button>`:''}</div>
    <button type="button" class="arr l" data-scroll="-1" aria-label="往左" disabled>${IC.l}</button>
    <div class="track">${L.length?L.slice(0,30).map(posterCard).join(''):'<div class="dropzone">把書拖到這裡<br>放進這個分類</div>'}</div>
    <button type="button" class="arr r" data-scroll="1" aria-label="往右">${IC.r}</button></section>`; }
function heroHtml(){
  const B=LIB.books;
  if(!B.length) return `<div class="hero"><div class="in"><div class="tx"><span class="kick">你的英文書房</span><h1>把書放進來，開始讀吧</h1>
    <div class="meta">匯入 PDF（或直接拖進這個視窗），AI 會幫你整理書名、分類和段落。左邊讀英文、右邊寫筆記，螢光筆、中文對照都有。</div>
    <div class="btns"><label class="filebtn primary">選擇 PDF<input type="file" accept="application/pdf,.pdf" multiple data-file></label><button type="button" class="sec" data-settings>設定</button></div></div></div></div>`;
  const b=B.filter(x=>x.opened&&x.status!=='done').sort(byOpened)[0]||B.slice().sort((x,y)=>y.added-x.added)[0], started=b.opened||b.lastPage;
  return `<div class="hero"><div class="bg" style="background-image:url('${coverUrl(b)}')"></div><div class="in">
    <div class="tx"><span class="kick">${started?'繼續閱讀':'最新加入'}</span><h1>${esc(b.title)}</h1>
      <div class="meta">${b.author?`<span>${esc(b.author)}</span>`:''}${b.category?`<span>${esc(b.category)}</span>`:''}${b.pages?`<span>${b.pages} 頁</span>`:''}${(b.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join('')}${b.notes?`<span>✎ ${b.notes} 則筆記</span>`:''}${aiTag(b)}</div>
      ${started&&b.pages?`<div class="pg"><div class="bar"><i style="width:${Math.round(prog(b)*100)}%"></i></div><span>第 ${b.lastPage+1} / ${b.pages} 頁</span></div>`:''}
      <div class="btns"><button type="button" class="primary" data-open="${b.id}">${IC.play}${started?'繼續閱讀':'開始閱讀'}</button><button type="button" class="sec" data-edit="${b.id}">${IC.more}詳細資料</button></div></div>
    <div class="poster" data-open="${b.id}" role="button" tabindex="-1" aria-hidden="true"><img src="${coverUrl(b)}" alt="" onerror="this.remove()"></div></div></div>`; }
function renderLib(soft){
  pollLib(); renderMenu(); document.querySelectorAll('.top [data-view]').forEach(b=>{ b.classList.toggle('on',b.dataset.view===VIEW); b.setAttribute('aria-pressed',String(b.dataset.view===VIEW)); });
  const q=$('q').value.trim().toLowerCase(), el=$('vLib');
  document.querySelectorAll('#nav [data-f]').forEach(b=>b.classList.toggle('on',!q&&b.dataset.f===FILTER));
  const keep=soft?[...el.querySelectorAll('.track')].map(t=>t.scrollLeft):null, top=scrollY;
  if(FILTER==='home'&&!q&&VIEW==='list'&&LIB.books.length){
    const B=LIB.books, groups=[...LIB.categories.map(c=>[c,'c:'+c,B.filter(b=>b.category===c)]),['未分類','none',B.filter(b=>!b.category)]].filter(g=>g[2].length);
    el.innerHTML=`<div class="page">${groups.map(([t,f,L])=>`<div class="hd" style="margin:${f===groups[0][1]?0:30}px 0 8px"><h1 style="font-size:19px">${esc(t)}</h1><span class="cnt note">${L.length} 本</span><button type="button" class="all small ghost" data-f="${esc(f)}">查看全部 ›</button></div><div data-drop="${esc(f)}" class="shelf" style="margin:0">${listHtml(L.sort(byOpened))}</div>`).join('')}
      <div style="padding-top:22px"><button type="button" class="small" data-addcat>＋ 新增分類</button></div></div>`;
  } else if(FILTER==='home'&&!q){
    const B=LIB.books, reading=B.filter(b=>(b.opened||b.lastPage)&&b.status!=='done').sort(byOpened);
    let h=heroHtml();
    if(B.length){
      h+=shelf('繼續閱讀','reading',reading)+shelf('最近加入','all',B.slice().sort(SORTS.added))+shelf('我的最愛','fav',B.filter(b=>b.favorite).sort(byOpened));
      LIB.categories.forEach(c=>{ h+=shelf(c,'c:'+c,B.filter(b=>b.category===c).sort(byOpened),true); });
      h+=shelf('未分類','none',B.filter(b=>!b.category).sort(byOpened),B.some(b=>!b.category))+shelf('讀完','done',B.filter(b=>b.status==='done').sort(byOpened));
      h+=`<div style="padding:26px var(--gx) 0"><button type="button" class="small" data-addcat>＋ 新增分類</button></div>`; }
    el.innerHTML=h;
  } else {
    const L=LIB.books.filter(b=>inFilter(b,q?'all':FILTER)&&(!q||[b.title,b.author,b.category,...(b.tags||[])].join(' ').toLowerCase().includes(q))).sort(SORTS[SORT]||byOpened);
    el.innerHTML=`<div class="page"><div class="hd"><button type="button" class="ib" data-f="home" title="回首頁" aria-label="回首頁">${IC.l}</button><h1>${q?`搜尋「${esc($('q').value.trim())}」`:esc(filterName(FILTER))}</h1><span class="cnt note">${L.length} 本</span><span class="grow"></span>
      <select id="sort" aria-label="排序"><option value="opened">最近閱讀</option><option value="added">最近加入</option><option value="title">書名</option><option value="progress">閱讀進度</option></select>
</div>

/* ---------- 匯入 PDF：在瀏覽器裡抽出文字（pdf.js），存到書庫 ---------- */
function linesOf(items){
  const lines=[]; let cur=null;
  for(const it of items){ if(typeof it.str!=='string') continue;
    const x=it.transform[4], y=it.transform[5], h=Math.abs(it.transform[3])||it.height||10;
    if(!it.str.trim()){ if(cur&&!/\s$/.test(cur.t)) cur.t+=' '; if(it.hasEOL) cur=null; continue; }
    if(cur&&Math.abs(y-cur.y)<h*0.6){ if(x>cur.xe+h*0.12&&!/\s$/.test(cur.t)&&!/^\s/.test(it.str)) cur.t+=' '; cur.t+=it.str; cur.xe=Math.max(cur.xe,x+(it.width||0)); }
    else { cur={y,x,h,t:it.str,xe:x+(it.width||0)}; lines.push(cur); }
    if(it.hasEOL) cur=null; }
  return lines.map(l=>(l.t=l.t.replace(/\s+/g,' ').trim(),l)).filter(l=>l.t); }
function parasOf(lines){
  if(!lines.length) return [];
  const gaps=[]; for(let i=1;i<lines.length;i++){ const g=lines[i-1].y-lines[i].y; if(g>0) gaps.push(g); }
  gaps.sort((a,b)=>a-b); const med=gaps.length?gaps[Math.floor(gaps.length/2)]:12;
  const maxW=Math.max(...lines.map(l=>l.xe-l.x)), left=Math.min(...lines.map(l=>l.x));
  const out=[]; let p='';
  lines.forEach((l,i)=>{ const pr=lines[i-1]; let brk=!pr;
    if(pr){ const g=pr.y-l.y;
      if(g<0||g>med*1.45) brk=true;                                         // 空一行、換欄
      else if(l.x>left+l.h*1.2&&l.x>pr.x+l.h*0.8&&/[.!?:"”’)]$/.test(pr.t)) brk=true;   // 首行縮排
      else if((pr.xe-pr.x)<maxW*0.72&&/[.!?:"”’]$/.test(pr.t)) brk=true;    // 上一行很短又是句尾
      else if(Math.abs(l.h-pr.h)>Math.max(pr.h,l.h)*0.25) brk=true; }      // 字的大小不同（標題）
    if(brk){ if(p) out.push(p); p=l.t; }
    else if(/[A-Za-z]-$/.test(p)&&/^[a-z]/.test(l.t)) p=p.slice(0,-1)+l.t;   // 行尾斷字 com- puter
    else p+=' '+l.t; });
  if(p) out.push(p);
  return out.map(s=>s.replace(/\s+/g,' ').trim()).filter(s=>s&&!/^(page\s*)?\d{1,4}$/i.test(s)); }
async function importFiles(files){
  files=[...files].filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');
  if(!files.length) return toast('只能匯入 PDF 檔');
  if(!window.pdfjsLib) return toast('PDF 元件沒載入（需要網路），請重新整理再試',5000);
  const cat=FILTER.startsWith('c:')&&!$('q').value?FILTER.slice(2):'';
  for(const [k,f] of files.entries()){
    const tag=files.length>1?`（${k+1}/${files.length}）`:'';
    try{
      toast(`<span class="spin"></span>上傳《${esc(f.name)}》${tag}`,0);
      const buf=await f.arrayBuffer();
      const meta=await api.post(`/api/upload?name=${encodeURIComponent(f.name)}&category=${encodeURIComponent(cat)}`,new Blob([buf]),true);
      const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
      const pages=[];
      for(let i=1;i<=pdf.numPages;i++){
        if(i%5===1||i===pdf.numPages) toast(`<span class="spin"></span>抽出文字《${esc(f.name)}》${tag} ${i}/${pdf.numPages} 頁`,0);
        const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); pages.push(parasOf(linesOf(tc.items))); pg.cleanup(); }
      let info={}; try{ info=(await pdf.getMetadata()).info||{}; }catch(e){}
      const useAi=LS.get('aiParse',true); const patch={}; if(info.Author) patch.author=info.Author; if(!useAi&&info.Title&&info.Title.length>3&&!/^(untitled|microsoft word|document)/i.test(info.Title)) patch.title=info.Title.replace(/\.pdf$/i,'').trim();
      // 封面：第一頁縮圖
      try{ const p1=await pdf.getPage(1), vp0=p1.getViewport({scale:1}), vp=p1.getViewport({scale:360/vp0.width}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
        await p1.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82)); await api.put(`/api/books/${meta.id}/cover`,blob,true); }catch(e){ console.warn('cover',e); }
      const m2=await api.put(`/api/books/${meta.id}/pages`,{pages});
      Object.assign(meta,m2); if(Object.keys(patch).length) Object.assign(meta,await api.patch(`/api/books/${meta.id}`,patch));
      if(useAi&&meta.hasText){ try{ Object.assign(meta,await api.post(`/api/books/${meta.id}/ai`,{})); }catch(e){ console.warn('ai',e); } }
      LIB.books=[meta,...LIB.books.filter(x=>x.id!==meta.id)]; renderLib();
      pdf.destroy();
      toast(meta.hasText?`已匯入《${esc(meta.title)}》，共 ${meta.pages} 頁${useAi?'；AI 在背景整理書名、分類和段落，可以先開始讀':''}`:`已匯入《${esc(meta.title)}》，但這個 PDF 是掃描圖片、抽不出文字：只能看原始頁面`,meta.hasText?3000:6000);
    }catch(e){ console.error(e); toast('匯入失敗：'+esc(e.message),6000); }
  }
}

    if(nid){ for(const k of Object.keys(ST.marks)){ ST.marks[k]=ST.marks[k].filter(r=>r[3]!==nid); if(!ST.marks[k].length) delete ST.marks[k]; } delete ST.notes[nid]; }
    else { const [i,s]=card.dataset.key.split(':').map(Number), k=mkey(pg,i); ST.marks[k]=(ST.marks[k]||[]).filter(r=>r[0]!==s); if(!ST.marks[k].length) delete ST.marks[k]; }
    save(); if(pg===PG&&MODE==='text') renderPage(); if(!$('allPane').hidden) renderAll(); return true; }
  return false; }
function jumpTo(pg,i,nid){ if(pg!==PG||MODE!=='text'){ MODE='text'; LS.set('mode',MODE); showPage(pg); }
  const p=$('en'+i); if(!p) return; p.scrollIntoView({block:'center',behavior:'smooth'}); p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash');
  if(nid) document.querySelectorAll(`#sheet mark[data-nid="${nid}"]`).forEach(m=>{ m.classList.add('lit'); setTimeout(()=>m.classList.remove('lit'),1500); }); }
$('sheet').addEventListener('input',e=>{ const t=e.target;
  if(t.matches('textarea')) autoGrow(t);
  if(t.id==='pgNote'){ const v=t.value; if(v.trim()) ST.pageNotes[PG]=v; else delete ST.pageNotes[PG]; return save(); }
  if(t.matches('[data-note]')){ const n=ST.notes[t.dataset.note]; if(n){ n.text=t.value; n.t=Date.now(); save(); } return; }
  if(t.matches('[data-pnt]')){ ST.paraNotes[mkey(PG,+t.dataset.pnt)]=t.value; return save(); }
  if(t.matches('[data-zh]')&&ST.zh[PG]){ ST.zh[PG][+t.dataset.zh]=t.innerText.trim(); save(); } });
$('sheet').addEventListener('focusout',e=>{ const t=e.target;      // 空的段落筆記：離開就收起來
  if(t.matches('[data-pnt]')&&!t.value.trim()){ delete ST.paraNotes[mkey(PG,+t.dataset.pnt)]; save(); setTimeout(()=>{ if(BOOK&&!document.activeElement.closest('#sheet textarea')) renderPage(); },0); } });
// 滑到段落／卡片：兩邊一起亮
$('sheet').addEventListener('mouseover',e=>{ const r=e.target.closest('.r2[data-i]'); document.querySelectorAll('#sheet .r2.hov').forEach(x=>{ if(x!==r) x.classList.remove('hov'); }); if(r) r.classList.add('hov');
  const c=e.target.closest('.hcard[data-nid]'); document.querySelectorAll('#sheet mark.lit').forEach(m=>m.classList.remove('lit')); if(c) document.querySelectorAll(`#sheet mark[data-nid="${c.dataset.nid}"]`).forEach(m=>m.classList.add('lit')); });
$('sheet').addEventListener('mouseleave',()=>document.querySelectorAll('#sheet .r2.hov,#sheet mark.lit').forEach(x=>x.classList.remove('hov','lit')));

/* ---------- 存檔 ---------- */
function save(){ clearTimeout(saveT); saveT=setTimeout(flushSave,500); }
function flushSave(){ if(!saveT||!BOOK) return; clearTimeout(saveT); saveT=null; const id=BOOK.meta.id, body=JSON.stringify(ST);
  fetch(`/api/books/${id}/state`,{method:'PUT',headers:{'Content-Type':'application/json'},body,keepalive:body.length<60000}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{ if(BOOK&&BOOK.meta.id===id){ BOOK.meta.notes=j.notes; BOOK.meta.marks=j.marks; } }).catch(()=>toast('存檔失敗：伺服器有開著嗎？',5000)); }
addEventListener('beforeunload',flushSave);
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushSave(); });

/* ---------- 中文（在英文底下） ---------- */
async function ensureZh(p,force){
  if(!BOOK||p<0||p>=nPages()) return; const P=paras(p); if(!P.length||(ST.zh[p]&&!force)) return; if(TR[p]) return TR[p];
  if(TR_ERR[p]&&!force&&p!==PG) return;
  const id=BOOK.meta.id; delete TR_ERR[p];
  TR[p]=api.post(`/api/books/${id}/translate`,{paras:P}).then(j=>{ if(BOOK&&BOOK.meta.id===id){ ST.zh[p]=j.zh; save(); } })
    .catch(e=>{ TR_ERR[p]=e.message; throw e; }).finally(()=>{ delete TR[p]; if(BOOK&&BOOK.meta.id===id&&p===PG&&ZH&&MODE==='text'&&!(document.activeElement&&document.activeElement.closest('#sheet textarea'))) renderPage(); });
  if(p===PG&&MODE==='text') renderPage(); return TR[p]; }

/* ---------- 全書筆記（右側滑出） ---------- */
$('allBtn').onclick=()=>{ $('allPane').hidden=!$('allPane').hidden; $('allBtn').classList.toggle('on',!$('allPane').hidden); if(!$('allPane').hidden) renderAll(); };
$('allX').onclick=()=>{ $('allPane').hidden=true; $('allBtn').classList.remove('on'); };
function renderAll(){
  const n=nPages(), C=+(LS.get('allC',-1));
  $('allTools').innerHTML=`<select id="allC" aria-label="篩選" class="small" style="min-height:28px;padding:2px 6px;font-size:12px"><option value="-1">全部</option><option value="0"${C===0?' selected':''}>只看筆記</option>${[1,2,3,4].map(c=>`<option value="${c}"${C===c?' selected':''}>${CNAME[c-1]}色</option>`).join('')}</select><button type="button" class="ib ghost" id="expMd" title="匯出成 Markdown 檔" aria-label="匯出成 Markdown 檔"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg></button>`;
  $('allC').onchange=e=>{ LS.set('allC',+e.target.value); renderAll(); }; $('expMd').onclick=exportMd;
  let h='', any=false;
  for(let p=0;p<n;p++){
    const L=cardsOfPage(p).filter(o=>C<0||(C===0?o.nid&&String((ST.notes[o.nid]||{}).text||'').trim():o.c===C));
    const pn=C<=0?ST.pageNotes[p]:null, PN=C<=0?Object.entries(ST.paraNotes).filter(([k,v])=>k.startsWith(p+':')&&String(v||'').trim()):[];
    if(!L.length&&!pn&&!PN.length) continue; any=true;
    h+=`<div class="pghd" data-gopg="${p}">${p===PG?'● ':''}第 ${p+1} 頁 →</div>`
      +(pn?`<div class="hcard hc0"><div class="meta">這一頁的筆記</div><div style="white-space:pre-wrap;font-family:var(--f-zh);font-size:14px">${esc(pn)}</div></div>`:'')
      +PN.map(([k,v])=>`<div class="hcard hc0" data-pg="${p}"><div class="meta">第 ${+k.split(':')[1]+1} 段的筆記</div><div style="white-space:pre-wrap;font-family:var(--f-zh);font-size:14px;cursor:pointer" data-pjump="${k}">${esc(v)}</div></div>`).join('')
      +L.map(o=>{ const t=o.nid&&String((ST.notes[o.nid]||{}).text||'').trim(); return cardHtml(o,true).replace(/<textarea[\s\S]*?<\/textarea>|<div><button type="button" class="small" data-addnote>＋ 筆記<\/button><\/div>/,t?`<div style="white-space:pre-wrap;font-family:var(--f-zh);font-size:14px">${esc(t)}</div>`:''); }).join(''); }
  $('allBody').innerHTML=any?h:'<div class="note">還沒有任何螢光筆或筆記。在左邊選取文字就能畫螢光筆。</div>'; }
$('allBody').addEventListener('click',e=>{ const gp=e.target.closest('[data-gopg]'); if(gp) return showPage(+gp.dataset.gopg);
  const pj=e.target.closest('[data-pjump]'); if(pj){ const [p,i]=pj.dataset.pjump.split(':').map(Number); return jumpTo(p,i); }
  handleCard(e); });
function exportMd(){
  const n=nPages(); let md=`# ${BOOK.meta.title}\n${BOOK.meta.author?`\n作者：${BOOK.meta.author}\n`:''}\n`;
  for(let p=0;p<n;p++){ const L=cardsOfPage(p), pn=ST.pageNotes[p], PN=Object.entries(ST.paraNotes).filter(([k,v])=>k.startsWith(p+':')&&String(v||'').trim());
    if(!L.length&&!pn&&!PN.length) continue; md+=`\n## 第 ${p+1} 頁\n\n`; if(pn) md+=pn.trim()+'\n\n';
    PN.forEach(([k,v])=>{ md+=`**第 ${+k.split(':')[1]+1} 段**：${v.trim()}\n\n`; });
    L.forEach(o=>{ md+=`> ${o.quote.replace(/\n/g,' ')}\n`; const t=o.nid&&ST.notes[o.nid]&&String(ST.notes[o.nid].text||'').trim(); md+=t?`\n${t}\n\n`:'\n'; }); }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'})); a.download=BOOK.meta.title.replace(/[\\/:*?"<>|]/g,'_')+' 筆記.md'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }

/* ---------- 開始 ---------- */
loadLib().then(()=>{ const m=location.hash.match(/book=([a-z0-9]+)/); if(m&&LIB.books.some(b=>b.id===m[1])) openBook(m[1]); }).catch(e=>{ $('vLib').innerHTML=`<div class="empty" style="margin-top:40px"><b>連不到 Readiverse 伺服器</b><span class="note">請用「開啟Readiverse.command」打開。${esc(e.message)}</span></div>`; });
</script>
